<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f12">
<title>Z-Parkour 3D</title>
<style>
:root{
  --bg:#0d0f12;
  --fg:#f4f4f6;
  --ac:#c93b2b;
  --panel:rgba(16,14,13,0.97);
  --card:rgba(30,25,22,0.96);
  --border:#5c4538;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
canvas{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:1;touch-action:none;
}
button{
  font:700 13px/1.1 system-ui,-apple-system,sans-serif;
  padding:11px 16px;
  border:2px solid var(--ac);
  background:rgba(24,18,17,0.92);
  color:var(--fg);
  border-radius:10px;
  cursor:pointer;
  touch-action:manipulation;
  pointer-events:auto;
  transition:transform .08s ease,background .12s ease,border-color .12s ease;
}
button:active{transform:scale(.94)}
button.primary{
  background:linear-gradient(180deg,#8f2419,#3d100b);
  border-color:#ff634f;
}

#cfgBtn{
  position:fixed;
  right:12px;
  top:calc(10px + env(safe-area-inset-top,0px));
  width:46px;height:46px;padding:0;border-radius:50%;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  z-index:300;
  background:rgba(24,18,17,0.95);
  border-color:#ff634f;
  box-shadow:0 4px 14px rgba(0,0,0,.65);
}

#hud{
  position:fixed;
  left:10px;
  top:calc(10px + env(safe-area-inset-top,0px));
  z-index:40;
  display:none;
  pointer-events:none;
  max-width:calc(100vw - 76px);
  text-shadow:0 2px 4px #000;
  font-weight:700;font-size:11.5px;
}
.hudTopRow{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
#zoneBadge,#armorBadge{
  display:inline-block;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,110,90,.6);
  padding:2px 8px;border-radius:6px;
  color:#ffc2b5;font-size:10.5px;
}
#armorBadge{border-color:rgba(96,165,250,.65);color:#bae6fd}
.barsRow{display:flex;flex-direction:column;gap:4px;width:158px}
.bar{
  width:100%;height:9px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.22);
  border-radius:5px;overflow:hidden;
}
.bar>i{display:block;height:100%;transition:width .1s linear}
#inf{margin-top:4px;line-height:1.25}
#matsHud{font-size:10.5px;opacity:.92;margin-top:2px}
#quickSlots{
  display:flex;gap:5px;margin-top:6px;
  pointer-events:auto;position:relative;z-index:45;
}
.qSlot{
  width:40px;height:40px;padding:0;border-radius:8px;
  border:1.5px solid #785b49;
  background:rgba(26,20,17,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;font-size:14px;
}
.qSlot small{position:absolute;top:1px;left:3px;font-size:8px;color:#ffd27d}
.qSlot span{position:absolute;bottom:1px;right:3px;font-size:9.5px;font-weight:800;color:#fff}

#bbar{
  position:fixed;top:calc(10px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);
  width:min(42vw,240px);height:10px;
  background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.35);
  display:none;z-index:40;border-radius:5px;overflow:hidden;pointer-events:none;
}
#bbi{display:block;height:100%;width:0%;background:#b833ff}
#crosshair{
  position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;
  border:1.5px solid rgba(255,255,255,.88);border-radius:50%;
  pointer-events:none;z-index:35;display:none;box-shadow:0 0 4px #000;
  transition:transform .08s ease,border-color .08s ease;
}
#crosshair.hs{
  transform:scale(1.65);
  border-color:#ff3b2f;
}
#hitFlash{
  position:fixed;inset:0;background:rgba(255,0,0,.28);
  opacity:0;pointer-events:none;z-index:60;
}
#msg{
  position:fixed;top:24%;left:0;width:100%;
  text-align:center;font:800 17px/1.2 system-ui,-apple-system,sans-serif;
  text-shadow:0 2px 8px #000;pointer-events:none;
  opacity:0;z-index:250;transition:opacity .2s;padding:0 12px;
}

#scopeOverlay{
  position:fixed;inset:0;display:none;pointer-events:none;z-index:36;
  background:radial-gradient(circle at center,transparent 27%,rgba(0,0,0,.78) 28%,#000 100%);
}
#scopeRing{
  position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:min(56vh,56vw);
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
}
#scopeH{position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:1.5px;background:rgba(255,70,70,.8);transform:translate(-50%,-50%)}
#scopeV{position:fixed;left:50%;top:50%;width:1.5px;height:min(56vh,56vw);background:rgba(255,70,70,.8);transform:translate(-50%,-50%)}
#scopeDot{position:fixed;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#ff3535;transform:translate(-50%,-50%)}
#scopeText{
  position:fixed;left:50%;bottom:calc(16% + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:1.5px;
  color:#ffb1a3;text-shadow:0 2px 4px #000;
}

#rightControls{
  position:fixed;
  right:12px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:none;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  z-index:90;
  pointer-events:none;
}
.rightMiniRow{display:flex;gap:8px;pointer-events:none}
.rightMainRow{display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.padBtn{
  width:52px;height:52px;padding:0;border-radius:50%;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,10,.82);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
  pointer-events:auto;
  touch-action:none;
}
#btnJump{width:60px;height:60px;font-size:24px}
#btnFire{width:68px;height:68px;font-size:28px;border-color:#ff523f;background:rgba(50,12,10,.88)}

#leftActionGrid{
  position:fixed;
  left:12px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:none;
  grid-template-columns:repeat(3,46px);
  gap:8px;
  z-index:90;
  pointer-events:none;
}
.topActionBtn{
  width:46px;height:46px;padding:0;border-radius:50%;
  font-size:18px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,10,.82);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
  pointer-events:auto;
}

.modal{
  position:fixed;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:16px;overflow-y:auto;
  background:var(--panel);z-index:200;
}
#menu{
  display:flex;
  background:radial-gradient(circle at center,rgba(0,0,0,.45),rgba(9,6,6,.92));
  text-align:center;z-index:150;
}
#menu h1{
  margin:0;font-size:44px;letter-spacing:4px;color:#ff5442;
  text-shadow:0 0 22px rgba(201,59,43,.75),0 4px 0 #380906;
}
#bestTxt{margin:0;font-size:13px;font-weight:800;color:#ffd27d;letter-spacing:1px}
#engineAlert{
  display:none;max-width:340px;font-size:12px;color:#ff9c8a;
  background:rgba(120,20,15,.45);border:1px solid #ff634f;
  padding:8px 12px;border-radius:8px;
}
.menuStack{display:flex;flex-direction:column;gap:10px;width:240px}
.menuStack button{width:100%;padding:14px 18px;font-size:14px;letter-spacing:1px}

.box{
  background:var(--card);border:2px solid var(--border);
  border-radius:14px;padding:16px;max-width:460px;width:100%;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.75);
}
.box h2{margin:0;text-align:center;color:#ff6b57;font-size:19px}
.rowCard{
  background:rgba(20,16,14,.85);border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;
}
.rowCard label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#ffd6be}
.rowCard input[type=range]{width:100%;accent-color:#ff5442;height:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* Inventário estilo The Walking Zombie 2 */
.invWrap{max-width:900px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:94vh}
.invTop{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px;border-bottom:2px solid #4e3b30;padding-bottom:8px;padding-right:52px;
}
.invTop h2{margin:0;color:#ff7849;font-size:19px;letter-spacing:1px}
.pills{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-weight:800}
.pill{background:#181311;border:1px solid #594438;padding:4px 8px;border-radius:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tabBtn{padding:8px 12px;font-size:11px;background:#1d1714;border-color:#5b4538}
.tabBtn.active{background:#8f2419;border-color:#ff725e}
.invMain{display:grid;grid-template-columns:255px 1fr;gap:12px;align-items:start;overflow:hidden}
@media(max-width:720px){.invMain{grid-template-columns:1fr}}
.invSidePanel{
  background:#191412;border:2px solid #594337;border-radius:12px;padding:12px;
  display:flex;flex-direction:column;gap:9px;
}
.equipStrip{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.equipBox{
  background:#241c18;border:1.5px solid #6b5243;border-radius:8px;padding:7px;font-size:10.5px;
}
.equipBox b{display:block;color:#ffd27d;font-size:9.5px;margin-bottom:2px;text-transform:uppercase}
#invInspector{
  background:#221b17;border:1.5px solid #634b3d;border-radius:9px;padding:10px;
  display:flex;flex-direction:column;gap:6px;min-height:118px;
}
#invGrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:7px;
  max-height:54vh;overflow-y:auto;padding-right:2px;
}
.twzSlot{
  background:linear-gradient(180deg,#28201c,#191412);
  border:2px solid #4f3d33;border-radius:8px;
  padding:7px 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:4px;min-height:86px;text-align:center;font-size:10.5px;position:relative;cursor:pointer;
}
.twzSlot.selected{box-shadow:0 0 0 2px #ffd27d;background:linear-gradient(180deg,#382a23,#211915)}
.twzSlot .tag{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.twzSlot .ico{font-size:21px;line-height:1}
.twzSlot .nm{font-weight:700;line-height:1.15;font-size:10px}
.twzSlot .qty{
  position:absolute;bottom:3px;right:5px;font-size:9.5px;font-weight:800;
  background:rgba(0,0,0,.72);padding:1px 4px;border-radius:4px;color:#ffd27d;
}
</style>
</head>
<body>

<button type="button" id="cfgBtn" aria-label="Configurações">⚙️</button>
<div id="msg"></div>
<div id="hitFlash"></div>
<div id="crosshair"></div>
<div id="bbar"><i id="bbi"></i></div>

<div id="scopeOverlay">
  <div id="scopeRing"></div>
  <div id="scopeH"></div>
  <div id="scopeV"></div>
  <div id="scopeDot"></div>
  <div id="scopeText">LUNETA ATIVA</div>
</div>

<div id="hud">
  <div class="hudTopRow">
    <div id="zoneBadge">🏙️ CENTRO DENSO</div>
    <div id="armorBadge">🛡️ 0%</div>
  </div>
  <div class="barsRow">
    <div class="bar"><i id="barHp" style="background:#e33;width:100%"></i></div>
    <div class="bar"><i id="barFd" style="background:#e90;width:80%"></i></div>
    <div class="bar"><i id="barWt" style="background:#39e;width:80%"></i></div>
    <div class="bar" style="height:6px"><i id="barSt" style="background:#4e8;width:100%"></i></div>
  </div>
  <div id="inf"></div>
  <div id="matsHud"></div>
  <div id="quickSlots">
    <button type="button" class="qSlot" id="qFood"><small>1</small>🍖<span id="qFoodN">0</span></button>
    <button type="button" class="qSlot" id="qWater"><small>2</small>💧<span id="qWaterN">0</span></button>
    <button type="button" class="qSlot" id="qGr"><small>G</small>💣<span id="qGrN">0</span></button>
    <button type="button" class="qSlot" id="qBb"><small>H</small>🧨<span id="qBbN">0</span></button>
  </div>
</div>

<div id="rightControls">
  <div class="rightMiniRow">
    <button type="button" class="padBtn" id="btnSlide" title="Deslizar">🛝</button>
    <button type="button" class="padBtn" id="btnDash" title="Dash">⚡</button>
    <button type="button" class="padBtn" id="btnSwap" title="Trocar Arma">🔄</button>
  </div>
  <div class="rightMainRow">
    <button type="button" class="padBtn" id="btnJump" title="Pular">⏫</button>
    <button type="button" class="padBtn" id="btnFire" title="Atirar">🔥</button>
  </div>
</div>

<div id="leftActionGrid">
  <button type="button" class="topActionBtn" id="btnGrenade" title="Granada">💣</button>
  <button type="button" class="topActionBtn" id="btnBomb" title="Bomba">🧨</button>
  <button type="button" class="topActionBtn" id="btnAim" title="Mirar">🎯</button>
  <button type="button" class="topActionBtn" id="btnCraft" title="Craft">🛠️</button>
  <button type="button" class="topActionBtn" id="btnReload" title="Recarregar">🔃</button>
  <button type="button" class="topActionBtn" id="btnInv" title="Inventário">🎒</button>
</div>

<div id="menu" class="modal">
  <h1>Z-PARKOUR</h1>
  <p id="bestTxt"></p>
  <p id="engineAlert">⚠️ Three.js não carregou. Verifique a conexão com a internet e recarregue.</p>
  <div class="menuStack">
    <button type="button" id="btnContinue" class="primary" style="display:none">CONTINUAR</button>
    <button type="button" id="btnNew" class="primary">▶ NOVO JOGO</button>
  </div>
</div>

<div id="cfgModal" class="modal">
  <div class="box">
    <h2>⚙️ CONFIGURAÇÕES</h2>
    <div class="rowCard">
      <label><span>🎯 Sensibilidade</span><span id="sensOut">1.0x</span></label>
      <input type="range" id="sensSlider" min="0.2" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="rowCard">
      <label><span>☀️ Horário</span></label>
      <div class="grid3" id="timeBtns">
        <button type="button" data-h="8">☀ MANHÃ</button>
        <button type="button" data-h="16">🌇 TARDE</button>
        <button type="button" data-h="22">🌙 NOITE</button>
      </div>
    </div>
    <div class="rowCard">
      <label><span>🖥️ Gráficos</span></label>
      <div class="grid2">
        <button type="button" id="btnRtx">✨ RTX: ON</button>
        <button type="button" id="btnPotato">⚙ BATATA: OFF</button>
        <button type="button" id="btnRes">📐 Res: 100%</button>
        <button type="button" id="btnFps">🎞 FPS: 60</button>
        <button type="button" id="btnPx">▦ Pixel: 1x</button>
        <button type="button" id="btnDist">👁 Render: Médio</button>
      </div>
    </div>
    <button type="button" id="btnFs">⛶ TELA CHEIA</button>
    <button type="button" id="btnCfgClose" class="primary">CONCLUÍDO</button>
  </div>
</div>

<div id="craftModal" class="modal">
  <div class="box" id="craftBox"></div>
</div>

<div id="invModal" class="modal">
  <div class="invWrap">
    <div class="invTop">
      <h2>🎒 INVENTÁRIO & EQUIPAMENTOS</h2>
      <div class="pills" id="invPills"></div>
    </div>
    <div class="tabs">
      <button type="button" class="tabBtn active" data-tab="all">Tudo</button>
      <button type="button" class="tabBtn" data-tab="weapons">Armas</button>
      <button type="button" class="tabBtn" data-tab="armors">Roupas</button>
      <button type="button" class="tabBtn" data-tab="items">Comida & Itens</button>
      <button type="button" class="tabBtn" data-tab="mats">Materiais</button>
    </div>
    <div class="invMain">
      <div class="invSidePanel">
        <div class="equipStrip">
          <div class="equipBox" id="slotWeaponEq"></div>
          <div class="equipBox" id="slotArmorEq"></div>
        </div>
        <div id="invInspector"></div>
        <div id="invResInfo" style="font-size:11px;opacity:.88;border-top:1px solid #3f3129;padding-top:6px"></div>
      </div>
      <div id="invGrid"></div>
    </div>
    <button type="button" id="btnInvClose" class="primary" style="align-self:center;min-width:190px">FECHAR INVENTÁRIO</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rand = Math.random;
const SAVE_KEY = 'zparkour3d_v5_save';
const CFG_KEY = 'zparkour3d_v5_cfg';
const memStorage = Object.create(null);

function saveData(key, val) {
  try { localStorage.setItem(key, String(val)); }
  catch (_) { memStorage[key] = String(val); }
}
function loadData(key) {
  try { return localStorage.getItem(key); }
  catch (_) { return memStorage[key] ?? null; }
}

function onTap(el, fn) {
  if (!el) return;
  let lastFire = 0;
  const run = e => {
    const now = Date.now();
    if (now - lastFire < 180) return;
    lastFire = now;
    e.stopPropagation();
    fn(e);
  };
  el.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    run(e);
  });
  el.addEventListener('click', run);
}

function onHold(el, onDown, onUp) {
  if (!el) return;
  let pointerId = null;
  const release = e => {
    if (pointerId !== null && e && e.pointerId !== undefined && e.pointerId !== pointerId) return;
    pointerId = null;
    onUp();
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    pointerId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    onDown();
  });
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
}

let msgTimer = null;
function toast(text) {
  const el = $('msg');
  if (!el) return;
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.style.opacity = '0'; }, 2100);
}

function pulseHeadshot() {
  const ch = $('crosshair');
  if (!ch) return;
  ch.classList.add('hs');
  clearTimeout(pulseHeadshot._t);
  pulseHeadshot._t = setTimeout(() => ch.classList.remove('hs'), 150);
}

const UI = {
  screen: 'menu',
  firing: false,
  aiming: false,
  invTab: 'all',
  selectedInvKey: 'w:0',
  cfg: {
    sens: 1.0,
    hr: 16,
    res: 1,
    fps: 60,
    px: 1,
    rd: 150,
    rtx: true,
    potato: false
  }
};

try {
  const savedCfg = JSON.parse(loadData(CFG_KEY) || '{}');
  Object.assign(UI.cfg, savedCfg);
} catch (_) {}

function persistCfg() {
  saveData(CFG_KEY, JSON.stringify(UI.cfg));
}

function releasePointerLockSafe() {
  try {
    if (document.pointerLockElement && document.exitPointerLock) {
      document.exitPointerLock();
    }
  } catch (_) {}
}

function syncScreenVisibility() {
  UI.firing = false;
  $('menu').style.display = UI.screen === 'menu' ? 'flex' : 'none';
  $('cfgModal').style.display = UI.screen === 'cfg' ? 'flex' : 'none';
  $('craftModal').style.display = UI.screen === 'craft' ? 'flex' : 'none';
  $('invModal').style.display = UI.screen === 'inv' ? 'flex' : 'none';

  const playing = UI.screen === 'play';
  const touchCapable = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  $('hud').style.display = playing ? 'block' : 'none';
  $('crosshair').style.display = (playing && !UI.aiming) ? 'block' : 'none';
  $('rightControls').style.display = (playing && touchCapable) ? 'flex' : 'none';
  $('leftActionGrid').style.display = (playing && touchCapable) ? 'grid' : 'none';
  if (!playing) {
    UI.aiming = false;
    $('scopeOverlay').style.display = 'none';
  }
}

let prevScreenBeforeCfg = 'menu';
function openConfig() {
  if (UI.screen === 'cfg') {
    UI.screen = prevScreenBeforeCfg;
    syncScreenVisibility();
    return;
  }
  prevScreenBeforeCfg = UI.screen;
  UI.screen = 'cfg';
  releasePointerLockSafe();
  syncScreenVisibility();
}

function requestFullscreenSafe() {
  try {
    const root = document.documentElement;
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      const p = req.call(root);
      if (p && p.catch) p.catch(() => {});
    }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (_) {}
}

  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  const roadMat = new T.MeshStandardMaterial({ map: roadTex, roughness: 0.55 });
  for (let k = -6; k <= 6; k++) {
    const r1 = new T.Mesh(new T.PlaneGeometry(MAP_LIMIT * 2, 12), roadMat);
    r1.rotation.x = -Math.PI / 2;
    r1.position.set(0, 0.02, k * 48);
    scene.add(r1);

    const r2 = new T.Mesh(new T.PlaneGeometry(MAP_LIMIT * 2, 12), roadMat);
    r2.rotation.x = -Math.PI / 2;
    r2.rotation.z = Math.PI / 2;
    r2.position.set(k * 48, 0.02, 0);
    scene.add(r2);
  }

  const boxes = [];
  const buildingLots = [];
  const pickups = [];
  const fxList = [];
  let zombies = [];
  let bombs = [];

  const intWallMat = new T.MeshStandardMaterial({ map: intWallTex, roughness: 0.78 });
  const intFloorMat = new T.MeshStandardMaterial({ map: intFloorTex, roughness: 0.8 });
  const roofMat = new T.MeshStandardMaterial({ color: 0x35383e, roughness: 0.7 });
  const crateMat = new T.MeshStandardMaterial({ map: crateTex, roughness: 0.7 });
  const rampMat = new T.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.65 });
  const concreteMat = new T.MeshStandardMaterial({ color: 0x71717a, roughness: 0.85 });

  function addObstacle(x, z, w, d, h, matOrTex, y0 = 0, isParkour = false) {
    let mat = matOrTex;
    if (matOrTex && matOrTex.isTexture) {
      mat = new T.MeshStandardMaterial({ map: matOrTex, roughness: 0.74 });
    } else if (typeof matOrTex === 'number') {
      mat = new T.MeshStandardMaterial({ color: matOrTex, roughness: 0.68 });
    }
    const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y0 + h / 2, z);
    mesh.castShadow = !UI.cfg.potato;
    mesh.receiveShadow = !UI.cfg.potato;
    scene.add(mesh);
    boxes.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, top: y0 + h, bot: y0, mesh, cx: x, cz: z, isParkour });
    return mesh;
  }

  function overlapsLot(x0, x1, z0, z1) {
    for (let i = 0; i < buildingLots.length; i++) {
      const lot = buildingLots[i];
      if (x0 < lot.x1 && x1 > lot.x0 && z0 < lot.z1 && z1 > lot.z0) return true;
    }
    return false;
  }

  function createPickupModel(kind, subId) {
    const g = new T.Group();
    if (kind === 'cons') {
      const item = CONSUMABLES.find(c => c.id === subId) || CONSUMABLES[0];
      const mat = new T.MeshStandardMaterial({ color: item.color, roughness: 0.4, metalness: 0.2 });
      const capMat = new T.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.7, roughness: 0.3 });
      if (item.id === 'apple') {
        const body = new T.Mesh(new T.SphereGeometry(0.22, 10, 10), mat);
        const stem = new T.Mesh(new T.CylinderGeometry(0.02, 0.02, 0.12, 6), new T.MeshStandardMaterial({ color: 0x4a2c11 }));
        stem.position.y = 0.22;
        g.add(body, stem);
      } else if (item.id === 'meal' || item.id === 'biscuit') {
        const box = new T.Mesh(new T.BoxGeometry(0.46, 0.18, 0.36), mat);
        const lid = new T.Mesh(new T.BoxGeometry(0.48, 0.04, 0.38), capMat);
        lid.position.y = 0.10;
        g.add(box, lid);
      } else if (item.id === 'water' || item.id === 'energy' || item.id === 'canned') {
        const rad = item.id === 'canned' ? 0.18 : 0.13;
        const ht = item.id === 'canned' ? 0.28 : 0.42;
        const cyl = new T.Mesh(new T.CylinderGeometry(rad, rad, ht, 10), mat);
        const top = new T.Mesh(new T.CylinderGeometry(rad * 0.65, rad * 0.65, 0.08, 8), capMat);
        top.position.y = ht / 2 + 0.03;
        g.add(cyl, top);
      } else {
        const box = new T.Mesh(new T.BoxGeometry(0.26, 0.36, 0.22), mat);
        const cross = new T.Mesh(new T.BoxGeometry(0.14, 0.05, 0.24), new T.MeshBasicMaterial({ color: 0xef4444 }));
        g.add(box, cross);
      }
    } else if (kind === 'armor') {
      const arm = ARMORS.find(a => a.id === subId) || ARMORS[1];
      const vestMat = new T.MeshStandardMaterial({ color: arm.sleeveColor, roughness: 0.5, metalness: 0.35 });
      const plateMat = new T.MeshStandardMaterial({ color: arm.gloveColor, roughness: 0.35, metalness: 0.6 });
      const chest = new T.Mesh(new T.BoxGeometry(0.52, 0.56, 0.26), vestMat);
      const plate = new T.Mesh(new T.BoxGeometry(0.38, 0.36, 0.30), plateMat);
      const shL = new T.Mesh(new T.BoxGeometry(0.18, 0.16, 0.28), plateMat);
      shL.position.set(-0.32, 0.22, 0);
      const shR = shL.clone(); shR.position.x = 0.32;
      g.add(chest, plate, shL, shR);
    } else if (kind === 'a') {
      const box = new T.Mesh(new T.BoxGeometry(0.48, 0.32, 0.32), new T.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.6 }));
      const stripe = new T.Mesh(new T.BoxGeometry(0.50, 0.08, 0.34), new T.MeshBasicMaterial({ color: 0xfacc15 }));
      g.add(box, stripe);
    } else if (kind === 'r') {
      const box = new T.Mesh(new T.BoxGeometry(0.46, 0.34, 0.46), new T.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.5, roughness: 0.4 }));
      g.add(box);
    } else {
      const caseBox = new T.Mesh(new T.BoxGeometry(0.75, 0.24, 0.34), new T.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.6, roughness: 0.3 }));
      const trim = new T.Mesh(new T.BoxGeometry(0.77, 0.06, 0.36), new T.MeshBasicMaterial({ color: 0xf59e0b }));
      g.add(caseBox, trim);
    }
    return g;
  }

  function spawnPickup(x, z, kind, yPos = 0.38, subId = null) {
    if (isBlocked(x, z, yPos - 0.2, 0.45)) return;
    if (kind === 'cons' && !subId) {
      subId = CONSUMABLES[Math.floor(rand() * CONSUMABLES.length)].id;
    }
    if (kind === 'armor' && !subId) {
      const tierPool = ['leather', 'leather', 'police', 'police', 'kevlar', 'survivor', 'jugger'];
      subId = tierPool[Math.floor(rand() * tierPool.length)];
    }
    const mesh = createPickupModel(kind, subId);
    mesh.position.set(x, yPos, z);
    scene.add(mesh);
    pickups.push({ x, y: yPos, z, kind, subId, mesh });
  }

  function buildThickBuilding(cx, cz, w, d, h, styleIdx = 0) {
    const extMat = new T.MeshStandardMaterial({ map: facadeTexList[styleIdx % facadeTexList.length], roughness: 0.72 });
    const wallT = 1.2;
    const doorW = 3.2;
    const doorH = 2.6;

    // Reserva lote com margem de segurança para evitar sobreposição
    buildingLots.push({
      x0: cx - w / 2 - 4.2,
      x1: cx + w / 2 + 4.2,
      z0: cz - d / 2 - 4.2,
      z1: cz + d / 2 + 4.2
    });

    addObstacle(cx, cz - d / 2 + wallT / 2, w, wallT, h, extMat, 0);
    const inN = new T.Mesh(new T.PlaneGeometry(w - wallT * 2, h), intWallMat);
    inN.position.set(cx, h / 2, cz - d / 2 + wallT + 0.03);
    scene.add(inN);

    const sideW = (w - doorW) / 2;
    addObstacle(cx - doorW / 2 - sideW / 2, cz + d / 2 - wallT / 2, sideW, wallT, h, extMat, 0);
    addObstacle(cx + doorW / 2 + sideW / 2, cz + d / 2 - wallT / 2, sideW, wallT, h, extMat, 0);
    if (h > doorH) {
      addObstacle(cx, cz + d / 2 - wallT / 2, doorW, wallT, h - doorH, extMat, doorH);
    }

    addObstacle(cx - w / 2 + wallT / 2, cz, wallT, d - wallT * 2, h, extMat, 0);
    const inW = new T.Mesh(new T.PlaneGeometry(d - wallT * 2, h), intWallMat);
    inW.rotation.y = Math.PI / 2;
    inW.position.set(cx - w / 2 + wallT + 0.03, h / 2, cz);
    scene.add(inW);

    addObstacle(cx + w / 2 - wallT / 2, cz, wallT, d - wallT * 2, h, extMat, 0);
    const inE = new T.Mesh(new T.PlaneGeometry(d - wallT * 2, h), intWallMat);
    inE.rotation.y = -Math.PI / 2;
    inE.position.set(cx + w / 2 - wallT - 0.03, h / 2, cz);
    scene.add(inE);

    const floor = new T.Mesh(new T.PlaneGeometry(w - wallT * 1.8, d - wallT * 1.8), intFloorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(cx, 0.04, cz);
    floor.receiveShadow = true;
    scene.add(floor);

    addObstacle(cx, cz, w + 0.4, d + 0.4, 0.65, roofMat, h, true);
    // Parapeito no topo do prédio
    addObstacle(cx, cz - d / 2 + 0.2, w + 0.5, 0.4, 0.55, concreteMat, h + 0.65, true);
    addObstacle(cx, cz + d / 2 - 0.2, w + 0.5, 0.4, 0.55, concreteMat, h + 0.65, true);

    // Escada de caixotes externa sem invadir outros lotes
    addObstacle(cx - w / 2 - 1.3, cz - 2.2, 2.2, 2.2, 1.35, crateMat, 0, true);
    addObstacle(cx - w / 2 - 1.3, cz + 0.3, 2.2, 2.2, 2.7, crateMat, 0, true);
    addObstacle(cx - w / 2 - 1.3, cz + 2.8, 2.2, 2.2, 4.1, crateMat, 0, true);
    addObstacle(cx + w * 0.25, cz + d * 0.22, 2.4, 2.4, 1.2, rampMat, h + 0.65, true);

    addObstacle(cx + w * 0.2, cz - d * 0.18, 2.0, 1.1, 0.9, crateMat, 0, true);
    spawnPickup(cx, cz, rand() < 0.32 ? 'armor' : 'cons', 0.42);
    spawnPickup(cx - 2.0, cz - 1.5, ['a', 'r', 'cons'][Math.floor(rand() * 3)], 0.42);
    spawnPickup(cx + w * 0.25, cz + d * 0.22, ['w', 'armor', 'a'][Math.floor(rand() * 3)], h + 2.25);
  }

  function buildCity() {
    let idx = 0;
    for (let i = -3; i <= 3; i++) {
      for (let j = -3; j <= 3; j++) {
        if (i === 0 && j === 0) continue;
        const cx = i * 48 + 24;
        const cz = j * 48 + 24;
        const w = 12.5 + Math.floor(rand() * 3.5);
        const d = 12.5 + Math.floor(rand() * 3.5);
        const h = 4.6 + Math.floor(rand() * 4) * 1.4;
        if (!overlapsLot(cx - w / 2 - 4.2, cx + w / 2 + 4.2, cz - d / 2 - 4.2, cz + d / 2 + 4.2)) {
          buildThickBuilding(cx, cz, w, d, h, idx++);
        }
      }
    }
    for (let k = 0; k < 105; k++) {
      const x = (rand() - 0.5) * MAP_LIMIT * 1.55;
      const z = (rand() - 0.5) * MAP_LIMIT * 1.55;
      if (Math.hypot(x, z) < 9) continue;
      if (overlapsLot(x - 1.6, x + 1.6, z - 1.6, z + 1.6)) continue;
      if (isBlocked(x, z, 0, 1.8)) continue;
      const h = 1.1 + rand() * 1.25;
      addObstacle(x, z, 1.8, 1.8, h, k % 4 === 0 ? concreteMat : crateMat, 0, true);
      if (k % 2 === 0) spawnPickup(x + 1.2, z, ['cons', 'a', 'r', 'armor'][k % 4], 0.4);
      if (k % 5 === 0) spawnPickup(x, z, ['a', 'r', 'w'][k % 3], h + 0.4);
    }
  }

  function isBlocked(x, z, y, rad) {
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (!b.mesh.visible) continue;
      if (x > b.x0 - rad && x < b.x1 + rad && z > b.z0 - rad && z < b.z1 + rad) {
        if (y < b.top - 0.35 && y + 1.75 > b.bot) return b;
      }
    }
    return null;
  }

  function getFloorHeight(x, z, y, rad = 0.35) {
    let floor = 0;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (!b.mesh.visible) continue;
      if (x > b.x0 - rad && x < b.x1 + rad && z > b.z0 - rad && z < b.z1 + rad) {
        if (y >= b.top - 0.45 && b.top > floor) floor = b.top;
      }
    }
    return floor;
  }

  function hasNearbyWall(x, z, y) {
    const checkR = 1.15;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (!b.mesh.visible) continue;
      if (y + 1.4 > b.bot && y < b.top) {
        if (x + checkR > b.x0 && x - checkR < b.x1 && z + checkR > b.z0 && z - checkR < b.z1) {
          return b;
        }
      }
    }
    return null;
  }

  // ============== ARMAS 3D (SUPORTE A 40 ARMAS + MÃOS + EFEITOS) ==============
  const matMetalDark = new T.MeshStandardMaterial({ color: 0x1e2229, metalness: 0.78, roughness: 0.28 });
  const matSteel = new T.MeshStandardMaterial({ color: 0xb0b8c4, metalness: 0.88, roughness: 0.18 });
  const matWood = new T.MeshStandardMaterial({ color: 0x6e3d1a, metalness: 0.08, roughness: 0.68 });
  const matPoly = new T.MeshStandardMaterial({ color: 0x262b26, metalness: 0.15, roughness: 0.58 });
  const matGold = new T.MeshStandardMaterial({ color: 0xeab308, metalness: 0.9, roughness: 0.18 });
  const matScopeLens = new T.MeshBasicMaterial({ color: 0x38bdf8 });
  const matRedDot = new T.MeshBasicMaterial({ color: 0xff2a2a });
  const matSleeve = new T.MeshStandardMaterial({ color: 0x3b4859, roughness: 0.7 });
  const matGlove = new T.MeshStandardMaterial({ color: 0xc99672, roughness: 0.6 });

  const gunGroup = new T.Group();
  gunGroup.position.set(0.25, -0.23, -0.50);
  camera.add(gunGroup);

  const muzzleFlashGroup = new T.Group();
  const flashMat = new T.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.92 });
  const mf1 = new T.Mesh(new T.BoxGeometry(0.16, 0.03, 0.03), flashMat);
  const mf2 = new T.Mesh(new T.BoxGeometry(0.03, 0.16, 0.03), flashMat);
  const mf3 = new T.Mesh(new T.BoxGeometry(0.04, 0.04, 0.18), new T.MeshBasicMaterial({ color: 0xff7b00, transparent: true, opacity: 0.85 }));
  muzzleFlashGroup.add(mf1, mf2, mf3);
  muzzleFlashGroup.visible = false;
  gunGroup.add(muzzleFlashGroup);

  let minigunBarrelRef = null;

  function addPart(group, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
    const m = new T.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rx) m.rotation.x = rx;
    if (ry) m.rotation.y = ry;
    if (rz) m.rotation.z = rz;
    group.add(m);
    return m;
  }

  function addHandsToWeapon(twoHanded, foreZ = -0.26, gripZ = 0.06, gripY = -0.11) {
    addPart(gunGroup, new T.BoxGeometry(0.075, 0.075, 0.09), matGlove, 0.005, gripY, gripZ);
    addPart(gunGroup, new T.BoxGeometry(0.085, 0.085, 0.28), matSleeve, 0.04, gripY - 0.05, gripZ + 0.18, -0.18, 0.14);
    if (twoHanded) {
      addPart(gunGroup, new T.BoxGeometry(0.075, 0.07, 0.095), matGlove, -0.02, -0.045, foreZ);
      addPart(gunGroup, new T.BoxGeometry(0.085, 0.08, 0.34), matSleeve, -0.11, -0.11, foreZ + 0.22, -0.22, -0.32);
    }
  }

  function resolveWeaponFamily(weapon, idx) {
    const raw = String(weapon?.model || '').toLowerCase();
    if (raw) return raw;
    const n = String(weapon?.name || '').toLowerCase();
    if (n.includes('revolver') || n.includes('magnum') || n.includes('.44')) return 'revolver';
    if (n.includes('pistola') || n.includes('pistol')) return 'pistol';
    if (n.includes('escopeta') || n.includes('shotgun') || n.includes('12')) return 'shotgun';
    if (n.includes('smg') || n.includes('mp5') || n.includes('uzi')) return 'smg';
    if (n.includes('ak')) return 'ak47';
    if (n.includes('sniper') || n.includes('dmr') || n.includes('awp') || n.includes('m24')) return 'sniper';
    if (n.includes('minigun') || n.includes('m134') || n.includes('metralhadora')) return 'minigun';
    if (n.includes('katana') || n.includes('espada')) return 'katana';
    if (n.includes('facão') || n.includes('faca') || n.includes('machete')) return 'machete';
    if (n.includes('marreta') || n.includes('martelo') || n.includes('hammer')) return 'hammer';
    return idx % 2 === 0 ? 'm4' : 'pistol';
  }

  function rebuildWeaponModel(weapon, weaponIdx = 0) {
    while (gunGroup.children.length) gunGroup.remove(gunGroup.children[0]);
    minigunBarrelRef = null;
    const type = resolveWeaponFamily(weapon, weaponIdx);
    const accentMat = weapon?.rarity === 'legendary' ? matGold : (weapon?.rarity === 'epic' ? matSteel : matPoly);

    if (type === 'pistol' || type === 'revolver') {
      const slideMat = type === 'revolver' ? matSteel : matMetalDark;
      addPart(gunGroup, new T.BoxGeometry(0.062, 0.068, 0.32), slideMat, 0, 0.025, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.056, 0.032, 0.30), accentMat, 0, -0.024, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.052, 0.165, 0.082), accentMat, 0, -0.115, 0.06, 0.24);
      addPart(gunGroup, new T.BoxGeometry(0.012, 0.018, 0.018), matRedDot, 0, 0.066, -0.19);
      addPart(gunGroup, new T.BoxGeometry(0.036, 0.016, 0.016), matMetalDark, 0, 0.065, 0.09);
      const barrel = new T.CylinderGeometry(0.014, 0.014, 0.18, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.028, -0.24);
      if (type === 'revolver') {
        const cyl = new T.CylinderGeometry(0.038, 0.038, 0.095, 10); cyl.rotateX(Math.PI / 2);
        addPart(gunGroup, cyl, matMetalDark, 0, 0.012, -0.06);
      }
      addHandsToWeapon(false, -0.1, 0.06, -0.11);
    } else if (type === 'shotgun') {
      addPart(gunGroup, new T.BoxGeometry(0.068, 0.09, 0.35), matWood, 0, -0.03, 0.28, -0.18);
      addPart(gunGroup, new T.BoxGeometry(0.074, 0.085, 0.36), matMetalDark, 0, 0.01, -0.02);
      const barrel = new T.CylinderGeometry(0.019, 0.019, 0.58, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.035, -0.45);
      const tube = new T.CylinderGeometry(0.015, 0.015, 0.50, 8); tube.rotateX(Math.PI / 2);
      addPart(gunGroup, tube, matMetalDark, 0, 0.0, -0.41);
      addPart(gunGroup, new T.BoxGeometry(0.082, 0.064, 0.22), matWood, 0, -0.005, -0.36);
      addHandsToWeapon(true, -0.34, 0.09, -0.09);
    } else if (type === 'ak47') {
      addPart(gunGroup, new T.BoxGeometry(0.072, 0.10, 0.32), matWood, 0, -0.025, 0.30, -0.15);
      addPart(gunGroup, new T.BoxGeometry(0.076, 0.092, 0.42), matMetalDark, 0, 0.01, -0.02);
      addPart(gunGroup, new T.BoxGeometry(0.070, 0.068, 0.24), matWood, 0, 0.005, -0.34);
      const gas = new T.CylinderGeometry(0.013, 0.013, 0.26, 8); gas.rotateX(Math.PI / 2);
      addPart(gunGroup, gas, matMetalDark, 0, 0.048, -0.34);
      const barrel = new T.CylinderGeometry(0.014, 0.014, 0.44, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.022, -0.60);
      addPart(gunGroup, new T.BoxGeometry(0.054, 0.22, 0.082), matMetalDark, 0, -0.14, -0.12, -0.28);
      addPart(gunGroup, new T.BoxGeometry(0.050, 0.14, 0.072), matWood, 0, -0.11, 0.08, 0.22);
      addHandsToWeapon(true, -0.32, 0.08, -0.10);
    } else if (type === 'm4' || type === 'smg') {
      const len = type === 'smg' ? 0.32 : 0.46;
      addPart(gunGroup, new T.BoxGeometry(0.070, 0.095, 0.28), accentMat, 0, -0.01, 0.28);
      addPart(gunGroup, new T.BoxGeometry(0.074, 0.092, len), matMetalDark, 0, 0.01, -0.04);
      addPart(gunGroup, new T.BoxGeometry(0.058, 0.018, len * 0.85), matSteel, 0, 0.064, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.052, 0.044, 0.085), accentMat, 0, 0.09, 0.02);
      addPart(gunGroup, new T.BoxGeometry(0.012, 0.012, 0.012), matRedDot, 0, 0.092, 0.02);
      const barrel = new T.CylinderGeometry(0.014, 0.014, type === 'smg' ? 0.22 : 0.38, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.02, type === 'smg' ? -0.30 : -0.44);
      addPart(gunGroup, new T.BoxGeometry(0.048, 0.20, 0.072), accentMat, 0, -0.13, -0.08, -0.12);
      addHandsToWeapon(true, type === 'smg' ? -0.22 : -0.30, 0.07, -0.10);
    } else if (type === 'sniper') {
      addPart(gunGroup, new T.BoxGeometry(0.072, 0.105, 0.36), accentMat, 0, -0.02, 0.32, -0.1);
      addPart(gunGroup, new T.BoxGeometry(0.076, 0.088, 0.48), matMetalDark, 0, 0.01, -0.04);
      const barrel = new T.CylinderGeometry(0.015, 0.018, 0.64, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.024, -0.56);
      const scope = new T.CylinderGeometry(0.028, 0.024, 0.34, 10); scope.rotateX(Math.PI / 2);
      addPart(gunGroup, scope, matMetalDark, 0, 0.095, -0.06);
      const lens = new T.CylinderGeometry(0.024, 0.024, 0.01, 10); lens.rotateX(Math.PI / 2);
      addPart(gunGroup, lens, matScopeLens, 0, 0.095, -0.232);
      addHandsToWeapon(true, -0.32, 0.09, -0.09);
    } else if (type === 'minigun') {
      addPart(gunGroup, new T.BoxGeometry(0.16, 0.16, 0.42), matMetalDark, 0, -0.02, 0.02);
      addPart(gunGroup, new T.BoxGeometry(0.12, 0.02, 0.24), matSteel, 0, 0.09, 0.0);
      minigunBarrelRef = new T.Group();
      minigunBarrelRef.position.set(0, -0.02, -0.48);
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        const b = new T.CylinderGeometry(0.013, 0.013, 0.64, 6); b.rotateX(Math.PI / 2);
        addPart(minigunBarrelRef, b, matSteel, Math.cos(ang) * 0.045, Math.sin(ang) * 0.045, 0);
      }
      const ring = new T.CylinderGeometry(0.065, 0.065, 0.04, 12); ring.rotateX(Math.PI / 2);
      addPart(minigunBarrelRef, ring, matGold, 0, 0, -0.20);
      gunGroup.add(minigunBarrelRef);
      addHandsToWeapon(true, -0.18, 0.14, -0.04);
    } else if (type === 'katana' || type === 'machete') {
      const bladeLen = type === 'katana' ? 0.82 : 0.56;
      const grip = new T.CylinderGeometry(0.022, 0.024, 0.25, 8); grip.rotateX(Math.PI / 2);
      addPart(gunGroup, grip, matPoly, 0, -0.04, 0.14);
      addPart(gunGroup, new T.BoxGeometry(0.085, 0.085, 0.024), type === 'katana' ? matGold : matMetalDark, 0, -0.03, 0.01);
      addPart(gunGroup, new T.BoxGeometry(0.014, 0.062, bladeLen), matSteel, 0, -0.01, -bladeLen / 2, -0.06);
      addPart(gunGroup, new T.BoxGeometry(0.016, 0.014, bladeLen), matGold, 0, 0.022, -bladeLen / 2, -0.06);
      addHandsToWeapon(false, -0.1, 0.14, -0.04);
    } else if (type === 'hammer') {
      const shaft = new T.CylinderGeometry(0.024, 0.026, 0.70, 8); shaft.rotateX(Math.PI / 2);
      addPart(gunGroup, shaft, matWood, 0, -0.04, -0.08);
      addPart(gunGroup, new T.BoxGeometry(0.19, 0.13, 0.20), matMetalDark, 0, 0.01, -0.42);
      addPart(gunGroup, new T.BoxGeometry(0.21, 0.11, 0.04), matSteel, 0, 0.01, -0.52);
      addHandsToWeapon(true, -0.16, 0.15, -0.04);
    }

    if (weapon && !weapon.melee) {
      muzzleFlashGroup.position.set(0, 0.022, weapon.muzzleZ || -0.45);
      muzzleFlashGroup.visible = false;
      gunGroup.add(muzzleFlashGroup);
    }
  }

  function applyArmorVisuals(armorId) {
    const arm = ARMORS.find(a => a.id === armorId) || ARMORS[0];
    matSleeve.color.setHex(arm.sleeveColor);
    matGlove.color.setHex(arm.gloveColor);
  }

  function spawnSparkOrBlood(pos, isBlood = false, count = 6) {
    const col = isBlood ? 0xb91c1c : 0xfbbf24;
    const mat = new T.MeshBasicMaterial({ color: col });
    const geo = new T.BoxGeometry(0.07, 0.07, 0.07);
    for (let i = 0; i < count; i++) {
      const m = new T.Mesh(geo, mat);
      m.position.copy(pos);
      scene.add(m);
      fxList.push({
        mesh: m,
        vx: (rand() - 0.5) * 4.5,
        vy: 1.5 + rand() * 3.5,
        vz: (rand() - 0.5) * 4.5,
        grav: 14,
        life: 0.35 + rand() * 0.2
      });
    }
  }

  function spawnShellCasing() {
    if (!gameState || UI.cfg.potato) return;
    const m = new T.Mesh(
      new T.CylinderGeometry(0.012, 0.012, 0.045, 6),
      matGold
    );
    const right = new T.Vector3(1, 0, 0).applyAxisAngle(new T.Vector3(0, 1, 0), gameState.yaw);
    m.position.set(gameState.x + right.x * 0.28, gameState.y + 1.52, gameState.z + right.z * 0.28);
    scene.add(m);
    fxList.push({
      mesh: m,
      vx: right.x * (2.2 + rand() * 1.4),
      vy: 2.1 + rand() * 1.2,
      vz: right.z * (2.2 + rand() * 1.4),
      grav: 15,
      spin: 18,
      life: 0.75
    });
  }

  function spawnSlashTrail() {
    const arc = new T.Mesh(
      new T.RingGeometry(0.32, 0.44, 14, 1, 0.2, Math.PI * 0.85),
      new T.MeshBasicMaterial({ color: 0xe0f2fe, side: T.DoubleSide, transparent: true, opacity: 0.75 })
    );
    arc.position.set(0, -0.05, -0.65);
    arc.rotation.z = -0.4;
    camera.add(arc);
    setTimeout(() => camera.remove(arc), 120);
  }

  // ============== ZUMBIS ARTICULADOS & ANIMADOS ==============
  const zSkinMat = new T.MeshStandardMaterial({ map: zSkinTex, roughness: 0.65 });
  const zFaceMat = new T.MeshStandardMaterial({ map: zFaceTex, roughness: 0.6 });
  const zClothesMat = new T.MeshStandardMaterial({ map: zClothesTex, roughness: 0.8 });
  const zRunnerClothesMat = new T.MeshStandardMaterial({ color: 0x8a2822, roughness: 0.72 });
  const zTankClothesMat = new T.MeshStandardMaterial({ color: 0x2c353d, metalness: 0.35, roughness: 0.55 });
  const zBoomClothesMat = new T.MeshStandardMaterial({ color: 0xd97706, emissive: 0x7c2d12, emissiveIntensity: 0.45, roughness: 0.5 });
  const zPantsMat = new T.MeshStandardMaterial({ color: 0x263447, roughness: 0.82 });
  const zShoeMat = new T.MeshStandardMaterial({ color: 0x161618, roughness: 0.75 });
  const zHairMat = new T.MeshStandardMaterial({ color: 0x1b140f, roughness: 0.88 });

  const geoTorso = new T.BoxGeometry(0.64, 0.86, 0.34);
  const geoHead = new T.BoxGeometry(0.42, 0.44, 0.42);
  const geoHair = new T.BoxGeometry(0.44, 0.10, 0.44);
  const geoArm = new T.BoxGeometry(0.18, 0.18, 0.66);
  const geoLeg = new T.BoxGeometry(0.21, 0.68, 0.22);
  const geoShoe = new T.BoxGeometry(0.23, 0.12, 0.34);

  function spawnZombie(x, z, hp, speed, kind = 'walker') {
    const isBoss = kind === 'boss';
    const g = new T.Group();
    const shirtMat = kind === 'runner' ? zRunnerClothesMat : kind === 'tank' ? zTankClothesMat : kind === 'boomer' ? zBoomClothesMat : zClothesMat;

    const torso = new T.Mesh(geoTorso, shirtMat);
    torso.position.y = 1.24;
    torso.castShadow = !UI.cfg.potato;

    const headMaterials = [zSkinMat, zSkinMat, zHairMat, zSkinMat, zFaceMat, zSkinMat];
    const head = new T.Mesh(geoHead, headMaterials);
    head.position.y = 1.94;
    head.userData.isHead = true;

    const hair = new T.Mesh(geoHair, zHairMat);
    hair.position.y = 2.18;

    const armL = new T.Mesh(geoArm, zSkinMat);
    armL.position.set(-0.43, 1.48, 0.28);
    armL.rotation.x = 0.15;

    const armR = new T.Mesh(geoArm, zSkinMat);
    armR.position.set(0.43, 1.48, 0.28);
    armR.rotation.x = 0.15;

    const legL = new T.Group();
    legL.position.set(-0.17, 0.78, 0);
    const legLMesh = new T.Mesh(geoLeg, zPantsMat);
    legLMesh.position.y = -0.34;
    const shoeL = new T.Mesh(geoShoe, zShoeMat);
    shoeL.position.set(0, -0.70, 0.05);
    legL.add(legLMesh, shoeL);

    const legR = new T.Group();
    legR.position.set(0.17, 0.78, 0);
    const legRMesh = new T.Mesh(geoLeg, zPantsMat);
    legRMesh.position.y = -0.34;
    const shoeR = new T.Mesh(geoShoe, zShoeMat);
    shoeR.position.set(0, -0.70, 0.05);
    legR.add(legRMesh, shoeR);

    g.add(torso, head, hair, armL, armR, legL, legR);
    g.position.set(x, 0, z);
    const scale = isBoss ? 2.15 : kind === 'tank' ? 1.45 : kind === 'runner' ? 0.95 : 1.0;
    g.scale.setScalar(scale);

    const dps = isBoss ? 34 : kind === 'tank' ? 24 : kind === 'runner' ? 16 : 14;
    g.userData = {
      hp, maxHp: hp, speed, kind, isBoss, dps,
      dead: false, deadTimer: 0, phase: rand() * 6.28,
      atkCd: 0, flinch: 0,
      limbs: { torso, armL, armR, legL, legR, head }
    };
    scene.add(g);
    zombies.push(g);
  }

  let gameState = null;

  function makeDefaultState() {
    const foodInv = {};
    CONSUMABLES.forEach(c => { foodInv[c.id] = 0; });
    foodInv.canned = 2;
    foodInv.water = 2;
    foodInv.apple = 1;

    const armorsOwned = {};
    ARMORS.forEach(a => { armorsOwned[a.id] = a.id === 'none'; });

    return {
      x: 0, y: 0, z: 0, vy: 0,
      yaw: 0, pitch: 0,
      hp: 100, food: 80, water: 80, stamina: 100,
      wIdx: 0,
      armorId: 'none',
      armorsOwned,
      owned: WEAPONS.map((_, i) => i === 0 || i === 10),
      mag: WEAPONS.map(w => w.mag),
      ammo: WEAPONS.map(w => w.pool),
      foodInv,
      mats: { m: 6, w: 4, c: 3, g: 3, gr: 2, bb: 1 },
      kills: 0, score: 0, combo: 0,
      cd: 0, reloadTimer: 0, reloadIdx: 0,
      dashTimer: 0, dashCd: 0, slideTimer: 0,
      airJumps: 1, wallJumpUsed: false, wasAir: false, airStreak: false,
      lastBossWave: 0, hordeTimer: 65, saveTimer: 0, muzzleTimer: 0
    };
  }

  function getTotalFoodCount() {
    if (!gameState) return 0;
    return CONSUMABLES.filter(c => c.kind === 'food').reduce((s, c) => s + (gameState.foodInv[c.id] || 0), 0);
  }

  function getTotalDrinkCount() {
    if (!gameState) return 0;
    return CONSUMABLES.filter(c => c.kind === 'drink' || c.kind === 'med').reduce((s, c) => s + (gameState.foodInv[c.id] || 0), 0);
  }

  function getCurrentArmor() {
    if (!gameState) return ARMORS[0];
    return ARMORS.find(a => a.id === gameState.armorId) || ARMORS[0];
  }

  function saveGame(clearRun = false) {
    if (!gameState) return;
    const bestPrev = Number(loadData('zparkour3d_best') || 0);
    const best = Math.max(bestPrev, gameState.score);
    saveData('zparkour3d_best', best);
    if (clearRun) {
      saveData(SAVE_KEY, '');
      $('btnContinue').style.display = 'none';
    } else {
      saveData(SAVE_KEY, JSON.stringify({
        hp: gameState.hp, food: gameState.food, water: gameState.water,
        wIdx: gameState.wIdx, armorId: gameState.armorId, armorsOwned: gameState.armorsOwned,
        owned: gameState.owned, mag: gameState.mag, ammo: gameState.ammo,
        foodInv: gameState.foodInv, mats: gameState.mats,
        kills: gameState.kills, score: gameState.score
      }));
      $('btnContinue').style.display = 'block';
    }
    $('bestTxt').textContent = best > 0 ? 'RECORDE: ' + best : '';
  }

  function clearEntities() {
    zombies.forEach(z => scene.remove(z));
    zombies = [];
    bombs.forEach(b => scene.remove(b.mesh));
    bombs = [];
    fxList.forEach(f => scene.remove(f.mesh));
    fxList.length = 0;
  }

  function resetWorld(useSave) {
    clearEntities();
    gameState = makeDefaultState();
    if (useSave) {
      try {
        const raw = JSON.parse(loadData(SAVE_KEY) || 'null');
        if (raw && raw.hp > 0) {
          gameState.hp = Math.min(100, Math.max(10, raw.hp));
          gameState.food = raw.food ?? 80;
          gameState.water = raw.water ?? 80;
          if (Array.isArray(raw.owned)) {
            for (let i = 0; i < Math.min(raw.owned.length, WEAPONS.length); i++) {
              if (raw.owned[i]) gameState.owned[i] = true;
            }
          }
          if (Array.isArray(raw.mag)) {
            for (let i = 0; i < Math.min(raw.mag.length, WEAPONS.length); i++) {
              if (typeof raw.mag[i] === 'number') gameState.mag[i] = raw.mag[i];
            }
          }
          if (Array.isArray(raw.ammo)) {
            for (let i = 0; i < Math.min(raw.ammo.length, WEAPONS.length); i++) {
              if (typeof raw.ammo[i] === 'number') gameState.ammo[i] = raw.ammo[i];
            }
          }
          gameState.wIdx = (raw.wIdx >= 0 && raw.wIdx < WEAPONS.length && gameState.owned[raw.wIdx]) ? raw.wIdx : 0;
          if (raw.armorId && ARMORS.some(a => a.id === raw.armorId)) gameState.armorId = raw.armorId;
          if (raw.armorsOwned) Object.assign(gameState.armorsOwned, raw.armorsOwned);
          if (raw.foodInv) Object.assign(gameState.foodInv, raw.foodInv);
          if (raw.mats) Object.assign(gameState.mats, raw.mats);
          gameState.kills = raw.kills || 0;
          gameState.score = raw.score || 0;
        }
      } catch (_) {}
    }
    applyArmorVisuals(gameState.armorId);
    rebuildWeaponModel(WEAPONS[gameState.wIdx], gameState.wIdx);
    for (let i = 0; i < 12; i++) spawnNearbyZombie();
  }

  function spawnNearbyZombie(forcedAngle = null) {
    if (!gameState) return;
    const wave = 1 + Math.floor(gameState.kills / 10);
    for (let attempt = 0; attempt < 15; attempt++) {
      const ang = forcedAngle !== null ? forcedAngle + (rand() - 0.5) * 0.6 : rand() * Math.PI * 2;
      const dist = 16 + rand() * 14;
      const x = gameState.x + Math.cos(ang) * dist;
      const z = gameState.z + Math.sin(ang) * dist;
      if (Math.abs(x) > MAP_LIMIT - 4 || Math.abs(z) > MAP_LIMIT - 4) continue;
      if (!isBlocked(x, z, 0, 0.6)) {
        const r = rand();
        let kind = 'walker';
        let hpMult = 1;
        let spdMult = 1;
        if (r < 0.22) { kind = 'runner'; hpMult = 0.72; spdMult = 1.65; }
        else if (r < 0.36 && wave >= 2) { kind = 'tank'; hpMult = 2.6; spdMult = 0.72; }
        else if (r < 0.48) { kind = 'boomer'; hpMult = 0.85; spdMult = 1.15; }

        const hp = (3.6 + wave * 0.5) * hpMult * (0.9 + rand() * 0.3);
        const speed = (2.35 + wave * 0.14) * spdMult * (0.9 + rand() * 0.3);
        spawnZombie(x, z, hp, speed, kind);
        return;
      }
    }
  }

  function spawnBoss() {
    if (!gameState) return;
    const wave = 1 + Math.floor(gameState.kills / 10);
    const ang = rand() * Math.PI * 2;
    const x = Math.max(-MAP_LIMIT + 6, Math.min(MAP_LIMIT - 6, gameState.x + Math.cos(ang) * 24));
    const z = Math.max(-MAP_LIMIT + 6, Math.min(MAP_LIMIT - 6, gameState.z + Math.sin(ang) * 24));
    spawnZombie(x, z, 44 + wave * 8, 2.25, 'boss');
    toast('☠ CHEFE APARECEU!');
    beep(55, 1.2, 'sawtooth', 0.25, 0.5);
  }

  function getZoneName(x, z) {
    const d = Math.hypot(x, z);
    if (d < 42) return '🏙️ CENTRO DENSO';
    if (Math.abs(x % 48) < 8 || Math.abs(z % 48) < 8) return '🛣️ AVENIDA PRINCIPAL';
    if (d < 155) return '🧱 ZONA DE PRÉDIOS';
    return '🏚️ PERIFERIA URBANA';
  }

  function doJump() {
    if (UI.screen !== 'play' || !gameState) return;
    ensureAudio();
    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    const onGround = gameState.vy === 0 && gameState.y <= floor + 0.04;
    if (onGround) {
      gameState.vy = 9.0;
      gameState.airJumps = 1;
      gameState.wallJumpUsed = false;
      gameState.airStreak = false;
      beep(270, 0.08, 'sine', 0.09, 1.3);
    } else if (!gameState.wallJumpUsed && hasNearbyWall(gameState.x, gameState.z, gameState.y) && gameState.stamina >= 15) {
      gameState.wallJumpUsed = true;
      gameState.stamina -= 15;
      gameState.vy = 9.2;
      gameState.dashTimer = 0.14;
      gameState.airStreak = true;
      toast('🧗 Wall Jump!');
      beep(380, 0.09, 'triangle', 0.11, 1.5);
    } else if (gameState.airJumps > 0 && gameState.stamina >= 20) {
      gameState.airJumps--;
      gameState.stamina -= 20;
      gameState.vy = 8.4;
      gameState.airStreak = true;
      beep(440, 0.1, 'triangle', 0.1, 1.6);
    }
  }

  function doDash() {
    if (UI.screen !== 'play' || !gameState) return;
    ensureAudio();
    if (gameState.dashCd <= 0 && gameState.stamina >= 25) {
      gameState.dashTimer = 0.18;
      gameState.dashCd = 0.8;
      gameState.stamina -= 25;
      gameState.airStreak = true;
      beep(190, 0.14, 'sawtooth', 0.12, 2.0);
    }
  }

  function doSlide() {
    if (UI.screen !== 'play' || !gameState) return;
    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    if (gameState.slideTimer <= 0 && gameState.y <= floor + 0.05) {
      gameState.slideTimer = 0.7;
      beep(110, 0.25, 'sawtooth', 0.09, 0.5);
    }
  }

  function doSwapWeapon(dir = 1) {
    if (UI.screen !== 'play' || !gameState) return;
    const n = WEAPONS.length;
    for (let step = 1; step <= n; step++) {
      const idx = (gameState.wIdx + dir * step + n * 4) % n;
      if (gameState.owned[idx]) {
        gameState.wIdx = idx;
        gameState.reloadTimer = 0;
        UI.aiming = false;
        rebuildWeaponModel(WEAPONS[idx], idx);
        toast(WEAPONS[idx].name);
        return;
      }
    }
  }

  function doReload() {
    if (UI.screen !== 'play' || !gameState) return;
    const w = WEAPONS[gameState.wIdx];
    if (!w || w.melee || gameState.reloadTimer > 0) return;
    if (gameState.mag[gameState.wIdx] >= w.mag || gameState.ammo[gameState.wIdx] <= 0) return;
    gameState.reloadTimer = w.rel;
    gameState.reloadIdx = gameState.wIdx;
    gunGroup.rotation.x = -0.45;
    beep(250, 0.12, 'square', 0.1, 0.7);
  }

  function consumeItemById(id) {
    if (!gameState) return false;
    const item = CONSUMABLES.find(c => c.id === id);
    if (!item || (gameState.foodInv[id] || 0) <= 0) return false;
    gameState.foodInv[id]--;
    gameState.food = Math.max(0, Math.min(100, gameState.food + item.food));
    gameState.water = Math.max(0, Math.min(100, gameState.water + item.water));
    gameState.hp = Math.min(100, gameState.hp + item.hp);
    gameState.stamina = Math.min(100, gameState.stamina + item.stam);
    beep(560, 0.12, 'sine', 0.12, 1.45);
    toast(`${item.icon} ${item.name} usado!`);
    return true;
  }

  function doUseFood() {
    if (UI.screen !== 'play' || !gameState) return;
    const order = ['meal', 'canned', 'biscuit', 'apple'];
    for (const id of order) {
      if (consumeItemById(id)) return;
    }
    toast('Sem comida no inventário');
  }

  function doUseWater() {
    if (UI.screen !== 'play' || !gameState) return;
    const order = ['water', 'juice', 'energy', 'medkit'];
    for (const id of order) {
      if (consumeItemById(id)) return;
    }
    toast('Sem bebida ou soro');
  }

  function doThrowItem(isBomb) {
    if (UI.screen !== 'play' || !gameState) return;
    if (isBomb) {
      if (gameState.mats.bb <= 0) { toast('Sem bombas caseiras'); return; }
      gameState.mats.bb--;
      const mesh = new T.Mesh(new T.SphereGeometry(0.26, 8, 8), new T.MeshStandardMaterial({ color: 0xb82925 }));
      mesh.position.set(gameState.x, gameState.y + 0.5, gameState.z);
      scene.add(mesh);
      bombs.push({ mesh, vx: 0, vy: 2, vz: 0, timer: 2.5, radius: 9, dmg: 26 });
      toast('Bomba armada!');
    } else {
      if (gameState.mats.gr <= 0) { toast('Sem granadas'); return; }
      gameState.mats.gr--;
      const dir = new T.Vector3();
      camera.getWorldDirection(dir);
      const mesh = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), new T.MeshStandardMaterial({ color: 0x4f6b2f }));
      mesh.position.set(gameState.x, gameState.y + 1.5, gameState.z);
      scene.add(mesh);
      bombs.push({ mesh, vx: dir.x * 15, vy: dir.y * 15 + 4, vz: dir.z * 15, timer: 1.8, radius: 7, dmg: 16 });
      toast('Granada lançada!');
    }
  }

  function explodeAt(x, y, z, radius, dmg, isBoomer = false) {
    beep(62, 0.35, 'sawtooth', 0.25, 0.35);
    const fx = new T.Mesh(new T.SphereGeometry(radius * 0.45, 10, 10), new T.MeshBasicMaterial({ color: isBoomer ? 0xff5500 : 0xffaa33, transparent: true, opacity: 0.8 }));
    fx.position.set(x, y, z);
    scene.add(fx);
    setTimeout(() => scene.remove(fx), 180);

    for (const zmb of zombies) {
      if (zmb.userData.dead) continue;
      const dist = Math.hypot(zmb.position.x - x, zmb.position.z - z);
      if (dist <= radius) {
        zmb.userData.hp -= dmg * (1 - dist / (radius * 1.15));
        zmb.userData.flinch = 0.25;
        if (zmb.userData.hp <= 0) killZombie(zmb, false, true);
      }
    }
    const pDist = Math.hypot(gameState.x - x, gameState.z - z);
    if (pDist < radius * 0.8) {
      damagePlayer(dmg * (isBoomer ? 0.35 : 0.45) * (1 - pDist / radius));
    }
  }

  function killZombie(zmb, isHeadshot, fromExplosion = false) {
    if (zmb.userData.dead) return;
    zmb.userData.dead = true;
    zmb.userData.deadTimer = 0;
    gameState.kills++;
    const mult = gameState.combo > 1 ? 1 + Math.min(1.5, gameState.combo * 0.15) : 1;
    const basePts = zmb.userData.isBoss ? 120 : zmb.userData.kind === 'tank' ? 40 : (isHeadshot ? 25 : 14);
    gameState.score += Math.round(basePts * mult);

    if (zmb.userData.kind === 'boomer' && !fromExplosion) {
      explodeAt(zmb.position.x, zmb.position.y + 1, zmb.position.z, 5.5, 18, true);
    }

    if (zmb.userData.isBoss) {
      toast('☠ Chefe derrotado! +120 pts');
      spawnPickup(zmb.position.x + 1.2, zmb.position.z, 'armor', 0.4, 'jugger');
      spawnPickup(zmb.position.x - 1.2, zmb.position.z, 'w', 0.4);
      spawnPickup(zmb.position.x, zmb.position.z + 1.2, 'cons', 0.4, 'meal');
    } else if (rand() < 0.42) {
      const dropRoll = rand();
      const dropKind = dropRoll < 0.42 ? 'cons' : dropRoll < 0.72 ? 'a' : dropRoll < 0.90 ? 'r' : 'armor';
      spawnPickup(zmb.position.x, zmb.position.z, dropKind, 0.4);
    }
  }

  function damagePlayer(amount) {
    if (!gameState || gameState.hp <= 0) return;
    const def = getCurrentArmor().def || 0;
    const mitigated = amount * (1 - def / 100);
    gameState.hp = Math.max(0, gameState.hp - mitigated);
    $('hitFlash').style.opacity = '0.55';
    if (gameState.hp <= 0) {
      saveGame(true);
      UI.screen = 'menu';
      syncScreenVisibility();
      toast('VOCÊ MORREU!');
    }
  }

  const raycaster = new T.Raycaster();
  raycaster.far = 115;

  function fireWeapon() {
    if (!gameState || gameState.cd > 0 || gameState.reloadTimer > 0) return;
    const w = WEAPONS[gameState.wIdx];
    if (!w) return;
    ensureAudio();

    if (w.melee) {
      gameState.cd = w.delay;
      beep(w.freq, 0.1, w.ty, 0.14, 1.5);
      gunGroup.position.z = -0.35;
      gunGroup.rotation.x = -0.68;
      gunGroup.rotation.z = 0.48;
      spawnSlashTrail();
      const dir = new T.Vector3();
      camera.getWorldDirection(dir);
      for (const zmb of zombies) {
        if (zmb.userData.dead) continue;
        const dx = zmb.position.x - gameState.x;
        const dz = zmb.position.z - gameState.z;
        const dist = Math.hypot(dx, dz);
        if (dist <= w.rng) {
          const align = ((dx / Math.max(0.01, dist)) * dir.x + (dz / Math.max(0.01, dist)) * dir.z);
          if (align > 0.35) {
            zmb.userData.hp -= w.dmg;
            zmb.userData.flinch = 0.2;
            spawnSparkOrBlood(new T.Vector3(zmb.position.x, zmb.position.y + 1.3, zmb.position.z), true, 5);
            if (zmb.userData.hp <= 0) killZombie(zmb, false);
          }
        }
      }
      return;
    }

    if (gameState.mag[gameState.wIdx] <= 0) {
      doReload();
      return;
    }

    gameState.cd = w.delay;
    gameState.mag[gameState.wIdx]--;
    gameState.muzzleTimer = 0.05;
    muzzleFlashGroup.visible = true;
    muzzleFlashGroup.rotation.z = rand() * Math.PI;
    spawnShellCasing();

    beep(w.freq, 0.1, w.ty, 0.15, 0.4);
    gunGroup.position.z = -0.42;
    gunGroup.rotation.x = 0.08;
    flashLight.intensity = 3.0;
    $('hitFlash').style.opacity = '0.20';

    const alive = zombies.filter(z => !z.userData.dead);
    if (!alive.length) return;

    const spread = w.sp * 10 * (UI.aiming ? 0.25 : 1);
    for (let i = 0; i < w.pel; i++) {
      raycaster.setFromCamera({ x: (rand() - 0.5) * spread, y: (rand() - 0.5) * spread }, camera);
      const hits = raycaster.intersectObjects(alive, true);
      if (!hits.length) continue;
      const hit = hits[0];
      let obj = hit.object;
      while (obj && !obj.userData.hp && obj.parent) obj = obj.parent;
      if (!obj || obj.userData.dead) continue;
      const hs = Boolean(hit.object.userData.isHead);
      obj.userData.flinch = 0.18;
      spawnSparkOrBlood(hit.point, true, hs ? 9 : 4);
      if (hs) {
        pulseHeadshot();
        beep(780, 0.06, 'sine', 0.11, 1.35);
      }
      obj.userData.hp -= w.dmg * (hs ? 2.2 : 1);
      if (obj.userData.hp <= 0) {
        killZombie(obj, hs);
      } else {
        gameState.score += hs ? 8 : 3;
      }
    }
  }

  function collectPickups() {
    if (!gameState) return;
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.mesh.rotation.y += 0.03;
      const dy = Math.abs((gameState.y + 0.9) - (p.y || 0.4));
      if (Math.hypot(p.x - gameState.x, p.z - gameState.z) < 1.55 && dy < 1.85) {
        beep(640, 0.12, 'sine', 0.14, 1.7);
        if (p.kind === 'cons') {
          const c = CONSUMABLES.find(x => x.id === p.subId) || CONSUMABLES[0];
          gameState.foodInv[c.id] = (gameState.foodInv[c.id] || 0) + 1;
          toast(`+1 ${c.icon} ${c.name}`);
        } else if (p.kind === 'armor') {
          const arm = ARMORS.find(a => a.id === p.subId) || ARMORS[1];
          gameState.armorsOwned[arm.id] = true;
          if (arm.def > getCurrentArmor().def) {
            gameState.armorId = arm.id;
            applyArmorVisuals(arm.id);
            toast(`Equipou: ${arm.icon} ${arm.name} (${arm.def}% Def)`);
          } else {
            toast(`Obteve: ${arm.icon} ${arm.name}`);
          }
        } else if (p.kind === 'a') {
          const idx = gameState.owned[gameState.wIdx] && !WEAPONS[gameState.wIdx].melee ? gameState.wIdx : 0;
          gameState.ammo[idx] += WEAPONS[idx].pool;
          toast('+ Munição (' + WEAPONS[idx].name + ')');
        } else if (p.kind === 'r') {
          const keys = ['m', 'w', 'c', 'g'];
          const mk = keys[Math.floor(rand() * keys.length)];
          gameState.mats[mk] += 1 + Math.floor(rand() * 2);
          toast('+ Material');
        } else if (p.kind === 'w') {
          const locked = WEAPONS.map((_, idx) => idx).filter(idx => !gameState.owned[idx]);
          if (locked.length) {
            let pick = pickRandomWeaponIdx();
            if (gameState.owned[pick]) pick = locked[Math.floor(rand() * locked.length)];
            gameState.owned[pick] = true;
            gameState.mag[pick] = WEAPONS[pick].mag;
            gameState.ammo[pick] = WEAPONS[pick].pool;
            toast('Nova arma: ' + WEAPONS[pick].name);
          } else {
            gameState.ammo[0] += WEAPONS[0].pool;
            toast('+ Munição');
          }
        }
        scene.remove(p.mesh);
        pickups.splice(i, 1);
      }
    }
  }

    if (UI.screen !== 'play') return;
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth * 0.5 && !touchStick.left) {
        touchStick.left = { id: t.identifier, ox: t.clientX, oy: t.clientY, dx: 0, dy: 0 };
      } else if (t.clientX >= innerWidth * 0.5 && !touchStick.right) {
        touchStick.right = { id: t.identifier, lx: t.clientX, ly: t.clientY };
      }
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (UI.screen !== 'play' || !gameState) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const L = touchStick.left;
      if (L && L.id === t.identifier) {
        let dx = t.clientX - L.ox;
        let dy = t.clientY - L.oy;
        const mag = Math.hypot(dx, dy);
        if (mag > 52) { dx = (dx / mag) * 52; dy = (dy / mag) * 52; }
        L.dx = dx / 52;
        L.dy = dy / 52;
      }
      const R = touchStick.right;
      if (R && R.id === t.identifier) {
        const sens = 0.0048 * UI.cfg.sens * (UI.aiming ? 0.45 : 1);
        gameState.yaw -= (t.clientX - R.lx) * sens;
        gameState.pitch = Math.max(-1.4, Math.min(1.4, gameState.pitch - (t.clientY - R.ly) * sens));
        R.lx = t.clientX;
        R.ly = t.clientY;
      }
    }
  }, { passive: false });

    for (const t of e.changedTouches) {

  function cullDistantGeometry() {
    const maxDist = (UI.cfg.rd || 150) + 25;
    const maxDistSq = maxDist * maxDist;
    const cx = camera.position.x;
    const cz = camera.position.z;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      const dx = b.cx - cx;
      const dz = b.cz - cz;
      b.mesh.visible = (dx * dx + dz * dz) <= maxDistSq;
    }
  }

  function updateSimulation(dt) {
    if (!gameState) return;
    gameState.cd = Math.max(0, gameState.cd - dt);
    gameState.dashCd = Math.max(0, gameState.dashCd - dt);
    if (gameState.dashTimer > 0) gameState.dashTimer -= dt;
    else gameState.stamina = Math.min(100, gameState.stamina + 18 * dt);
    if (gameState.slideTimer > 0) gameState.slideTimer -= dt;

    if (gameState.muzzleTimer > 0) {
      gameState.muzzleTimer -= dt;
      if (gameState.muzzleTimer <= 0) muzzleFlashGroup.visible = false;
    }

    if (gameState.reloadTimer > 0) {
      gameState.reloadTimer -= dt;
      if (gameState.reloadTimer <= 0) {
        const w = WEAPONS[gameState.reloadIdx];
        if (w && !w.melee && gameState.owned[gameState.reloadIdx]) {
          const need = Math.min(w.mag - gameState.mag[gameState.reloadIdx], gameState.ammo[gameState.reloadIdx]);
          if (need > 0) {
            gameState.mag[gameState.reloadIdx] += need;
            gameState.ammo[gameState.reloadIdx] -= need;
          }
        }
      }
    }

    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let iz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    if (touchStick.left) {
      ix = touchStick.left.dx;
      iz = touchStick.left.dy;
    }
    const mag = Math.hypot(ix, iz);
    if (mag > 1) { ix /= mag; iz /= mag; }
    if (gameState.slideTimer > 0 && mag < 0.1) iz = -1;
    if (gameState.dashTimer > 0 && mag < 0.1) iz = -1;

    const sprinting = keys.ShiftLeft || (touchStick.left && mag > 0.88);
    const speed = (sprinting ? 8.8 : 5.9) * (gameState.slideTimer > 0 ? 1.58 : 1) * (gameState.dashTimer > 0 ? 2.65 : 1);
    const cosY = Math.cos(gameState.yaw);
    const sinY = Math.sin(gameState.yaw);
    const moveX = (ix * cosY + iz * sinY) * speed * dt;
    const moveZ = (-ix * sinY + iz * cosY) * speed * dt;

    const hitX = isBlocked(gameState.x + moveX, gameState.z, gameState.y, 0.42);
    const hitZ = isBlocked(gameState.x, gameState.z + moveZ, gameState.y, 0.42);
    if (!hitX) gameState.x += moveX;
    if (!hitZ) gameState.z += moveZ;

    const stepTarget = hitX || hitZ;
    if (stepTarget && gameState.y <= stepTarget.top && stepTarget.top - gameState.y <= 1.45 && mag > 0.25) {
      gameState.y = stepTarget.top;
      gameState.vy = Math.max(gameState.vy, 1.8);
      gameState.airJumps = 1;
      gameState.wallJumpUsed = false;
    }

    gameState.x = Math.max(-MAP_LIMIT + 2, Math.min(MAP_LIMIT - 2, gameState.x));
    gameState.z = Math.max(-MAP_LIMIT + 2, Math.min(MAP_LIMIT - 2, gameState.z));

    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    gameState.vy -= 23 * dt;
    gameState.y += gameState.vy * dt;

    if (gameState.y <= floor) {
      if (gameState.wasAir && floor > 0.6 && gameState.airStreak) {
        gameState.combo++;
        gameState.score += 15 * gameState.combo;
        beep(520, 0.14, 'sine', 0.12, 1.8);
      } else if (gameState.wasAir && floor <= 0.6) {
        gameState.combo = 0;
      }
      gameState.y = floor;
      gameState.vy = 0;
      gameState.wasAir = false;
      gameState.airJumps = 1;
      gameState.wallJumpUsed = false;
      gameState.airStreak = false;
    } else {
      gameState.wasAir = true;
    }

    gameState.food = Math.max(0, gameState.food - 0.30 * dt);
    gameState.water = Math.max(0, gameState.water - 0.42 * dt);
    if (gameState.food <= 0 || gameState.water <= 0) {
      damagePlayer(2.0 * dt);
    } else if (gameState.food > 55 && gameState.water > 55) {
      gameState.hp = Math.min(100, gameState.hp + 1.1 * dt);
    }

    const wave = 1 + Math.floor(gameState.kills / 10);
    if (wave % 3 === 0 && gameState.lastBossWave !== wave) {
      gameState.lastBossWave = wave;
      spawnBoss();
    }

    gameState.hordeTimer -= dt;
    if (gameState.hordeTimer <= 0) {
      gameState.hordeTimer = 85;
      const hAng = rand() * Math.PI * 2;
      for (let i = 0; i < 10 + wave * 2; i++) spawnNearbyZombie(hAng);
      toast('⚠ HORDA SE APROXIMANDO!');
      beep(65, 0.9, 'sawtooth', 0.22, 0.6);
    }

    const targetZombies = Math.min(34, 10 + wave * 3);
    while (zombies.filter(z => !z.userData.dead).length < targetZombies && rand() < 0.25) {
      spawnNearbyZombie();
    }

    if (UI.firing) fireWeapon();
    collectPickups();

    for (let i = fxList.length - 1; i >= 0; i--) {
      const f = fxList[i];
      f.life -= dt;
      f.vy -= (f.grav || 12) * dt;
      f.mesh.position.x += f.vx * dt;
      f.mesh.position.y += f.vy * dt;
      f.mesh.position.z += f.vz * dt;
      if (f.spin) f.mesh.rotation.x += f.spin * dt;
      if (f.mesh.position.y < 0.03) {
        f.mesh.position.y = 0.03;
        f.vy *= -0.3;
        f.vx *= 0.5;
        f.vz *= 0.5;
      }
      if (f.life <= 0) {
        scene.remove(f.mesh);
        fxList.splice(i, 1);
      }
    }

    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.timer -= dt;
      b.vy -= 20 * dt;
      b.mesh.position.x += b.vx * dt;
      b.mesh.position.y += b.vy * dt;
      b.mesh.position.z += b.vz * dt;
      const bFloor = getFloorHeight(b.mesh.position.x, b.mesh.position.z, b.mesh.position.y, 0.2) + 0.2;
      if (b.mesh.position.y < bFloor) {
        b.mesh.position.y = bFloor;
        b.vy *= -0.35;
        b.vx *= 0.7;
        b.vz *= 0.7;
      }
      if (b.timer <= 0) {
        explodeAt(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, b.radius, b.dmg, false);
        scene.remove(b.mesh);
        bombs.splice(i, 1);
      }
    }

    const nowSec = performance.now() * 0.001;
    for (let i = zombies.length - 1; i >= 0; i--) {
      const zmb = zombies[i];
      const d = zmb.userData;
      if (d.dead) {
        d.deadTimer += dt;
        zmb.rotation.x = Math.min(1.5, d.deadTimer * 3.5);
        zmb.position.y = Math.max(-0.35, -d.deadTimer * 0.35);
        if (d.deadTimer > 1.0) {
          scene.remove(zmb);
          zombies.splice(i, 1);
        }
        continue;
      }
      d.atkCd = Math.max(0, d.atkCd - dt);
      d.flinch = Math.max(0, d.flinch - dt);

      const dx = gameState.x - zmb.position.x;
      const dz = gameState.z - zmb.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 65 && !d.isBoss) {
        scene.remove(zmb);
        zombies.splice(i, 1);
        continue;
      }
      let moving = false;
      if (dist > 0.05 && dist < 36) {
        moving = true;
        const stepDist = d.speed * dt;
        const nx = zmb.position.x + (dx / dist) * stepDist;
        const nz = zmb.position.z + (dz / dist) * stepDist;
        if (!isBlocked(nx, zmb.position.z, 0, 0.45)) zmb.position.x = nx;
        if (!isBlocked(zmb.position.x, nz, 0, 0.45)) zmb.position.z = nz;
        zmb.rotation.y = Math.atan2(dx, dz);
      }

      const L = d.limbs;
      if (L) {
        const freqMult = d.kind === 'runner' ? 4.4 : d.kind === 'tank' ? 2.1 : 2.9;
        const swing = moving ? Math.sin(nowSec * d.speed * freqMult + d.phase) : 0;
        const flinchTilt = d.flinch > 0 ? -0.22 * (d.flinch / 0.2) : 0;
        L.legL.rotation.x = swing * 0.78;
        L.legR.rotation.x = -swing * 0.78;
        L.torso.rotation.x = (d.kind === 'runner' ? 0.22 : 0.08) + flinchTilt;
        L.armL.rotation.x = (d.kind === 'runner' ? 0.65 : 0.22) + swing * 0.32;
        L.armR.rotation.x = (d.kind === 'runner' ? 0.65 : 0.22) - swing * 0.32;
        L.head.rotation.z = Math.sin(nowSec * 2.2 + d.phase) * 0.14;
        L.head.rotation.x = flinchTilt * 1.3;
      }

      const reach = d.isBoss ? 1.9 : d.kind === 'tank' ? 1.45 : 1.05;
      if (dist < reach && gameState.y < 1.35) {
        if (d.kind === 'boomer') {
          killZombie(zmb, false, false);
        } else if (d.atkCd <= 0) {
          d.atkCd = 0.75;
          if (L) {
            L.armL.rotation.x = 1.05;
            L.armR.rotation.x = 1.05;
          }
          damagePlayer(d.dps * 0.75);
        }
      }
    }

    gameState.saveTimer += dt;
    if (gameState.saveTimer > 6) {
      gameState.saveTimer = 0;
      saveGame(false);
    }
  }

  let lastHudCache = '';
  function syncHud() {
    if (!gameState) return;
    const w = WEAPONS[gameState.wIdx] || WEAPONS[0];
    const r = RARITY[w.rarity] || RARITY.common;
    const curA = getCurrentArmor();
    const wave = 1 + Math.floor(gameState.kills / 10);
    const zone = getZoneName(gameState.x, gameState.z);

    $('barHp').style.width = Math.max(0, gameState.hp) + '%';
    $('barFd').style.width = Math.max(0, gameState.food) + '%';
    $('barWt').style.width = Math.max(0, gameState.water) + '%';
    $('barSt').style.width = Math.max(0, gameState.stamina) + '%';

    $('qFoodN').textContent = getTotalFoodCount();
    $('qWaterN').textContent = getTotalDrinkCount();
    $('qGrN').textContent = gameState.mats.gr || 0;
    $('qBbN').textContent = gameState.mats.bb || 0;

    const ammoTxt = w.melee ? 'Corpo a corpo' : (gameState.reloadTimer > 0 ? 'Recarregando...' : `${gameState.mag[gameState.wIdx]}/${gameState.ammo[gameState.wIdx]}`);
    const hudKey = `${zone}|${curA.def}|${w.name}|${ammoTxt}|${wave}|${gameState.score}|${gameState.combo}|${gameState.mats.m}|${gameState.mats.w}|${gameState.mats.c}|${gameState.mats.g}`;
    if (hudKey !== lastHudCache) {
      lastHudCache = hudKey;
      $('zoneBadge').textContent = zone;
      $('armorBadge').textContent = `🛡️ ${curA.def}%`;
      $('matsHud').textContent = `⚙️ ${gameState.mats.m} · 🪵 ${gameState.mats.w} · 🧵 ${gameState.mats.c} · 💥 ${gameState.mats.g}`;
      $('inf').innerHTML = `${w.name} <span style="color:${r.color}">[${r.label}]</span> (${ammoTxt}) · Onda ${wave} · Pts ${gameState.score}${gameState.combo > 1 ? ` · x${gameState.combo}` : ''}`;
    }

    const activeBoss = zombies.find(z => !z.userData.dead && z.userData.isBoss);
    $('bbar').style.display = (UI.screen === 'play' && activeBoss) ? 'block' : 'none';
    if (activeBoss) {
      $('bbi').style.width = Math.max(0, (activeBoss.userData.hp / activeBoss.userData.maxHp) * 100) + '%';
    }
  }

  let lastFrame = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    if (UI.cfg.fps && now - lastFrame < 1000 / UI.cfg.fps - 2) return;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (UI.screen === 'play' && gameState) {
      updateSimulation(dt);
      const crouchOffset = gameState.slideTimer > 0 ? 0.85 : 0;
      camera.position.set(gameState.x, gameState.y + 1.7 - crouchOffset, gameState.z);
      camera.rotation.y = gameState.yaw;
      camera.rotation.x = gameState.pitch;

      if ((++cullCounter & 3) === 0) cullDistantGeometry();

      const curW = WEAPONS[gameState.wIdx] || WEAPONS[0];
      const scoped = Boolean(UI.aiming && curW.scope);
      const targetFov = UI.aiming ? (curW.scope ? (curW.zoom || 18) : 52) : (gameState.dashTimer > 0 ? 86 : 75);
      if (Math.abs(camera.fov - targetFov) > 0.1) {
        camera.fov += (targetFov - camera.fov) * 0.22;
        camera.updateProjectionMatrix();
      }
      $('scopeOverlay').style.display = scoped ? 'block' : 'none';
      $('crosshair').style.display = scoped ? 'none' : 'block';
      gunGroup.visible = !scoped;

      if (minigunBarrelRef && UI.firing && gameState.mag[gameState.wIdx] > 0) {
        minigunBarrelRef.rotation.z += dt * 24;
      }
      const bob = Math.sin(now * 0.008) * 0.006;
      const reloadDip = gameState.reloadTimer > 0 ? -0.10 : 0;
      const reloadPitch = gameState.reloadTimer > 0 ? -0.35 : 0;
      gunGroup.position.x += ((UI.aiming ? 0 : 0.25) - gunGroup.position.x) * 12 * dt;
      gunGroup.position.y += ((UI.aiming ? -0.17 : -0.23 + bob + reloadDip) - gunGroup.position.y) * 12 * dt;
      gunGroup.position.z += (-0.50 - gunGroup.position.z) * 10 * dt;
      gunGroup.rotation.x += (reloadPitch - gunGroup.rotation.x) * 12 * dt;
      gunGroup.rotation.z += ((gameState.slideTimer > 0 ? -0.22 : 0) - gunGroup.rotation.z) * 12 * dt;

      flashLight.intensity = Math.max(0, flashLight.intensity - dt * 28);
      $('hitFlash').style.opacity = String(Math.max(0, parseFloat($('hitFlash').style.opacity || '0') - dt * 3.5));
      syncHud();
    } else if (UI.screen === 'menu') {
      const ang = now * 0.00025;
      camera.position.set(Math.cos(ang) * 32, 14, Math.sin(ang) * 32);
      camera.lookAt(0, 3, 0);
      gunGroup.visible = false;
    }

    renderer.render(scene, camera);
  }

  Bridge.startGame = (useSave = false) => {
    ensureAudio();
    if (matchMedia('(pointer: coarse)').matches) requestFullscreenSafe();
    resetWorld(useSave);
    UI.screen = 'play';
    UI.aiming = false;
    syncScreenVisibility();
    syncHud();
    toast(useSave ? 'Jogo carregado!' : 'Novo jogo iniciado!');
  };
  Bridge.jump = doJump;
  Bridge.dash = doDash;
  Bridge.swapWeapon = doSwapWeapon;
  Bridge.slide = doSlide;
  Bridge.throwItem = doThrowItem;
  Bridge.reload = doReload;
  Bridge.useFood = doUseFood;
  Bridge.useWater = doUseWater;

  window.addEventListener('resize', Bridge.applyGraphics);

  buildCity();
  resetWorld(false);
  Bridge.applyGraphics();

  const bestSaved = Number(loadData('zparkour3d_best') || 0);
  if (bestSaved > 0) $('bestTxt').textContent = 'RECORDE: ' + bestSaved;
  try {
    const prevRun = JSON.parse(loadData(SAVE_KEY) || 'null');
    if (prevRun && prevRun.hp > 0) $('btnContinue').style.display = 'block';
  } catch (_) {}

  UI.screen = 'menu';
  syncScreenVisibility();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
