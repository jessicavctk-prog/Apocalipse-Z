<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f12">
<title>Z-Parkour 3D</title>
<style>
:root{
  --bg:#0d0f12;
  --fg:#f4f4f6;
  --ac:#c93b2b;
  --panel:rgba(18,15,14,0.96);
  --card:rgba(33,27,24,0.95);
  --border:#594337;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
canvas{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:1;touch-action:none;
}
button{
  font:700 13px/1.1 system-ui,-apple-system,sans-serif;
  padding:11px 16px;
  border:2px solid var(--ac);
  background:rgba(24,18,17,0.92);
  color:var(--fg);
  border-radius:10px;
  cursor:pointer;
  touch-action:manipulation;
  pointer-events:auto;
  transition:transform .08s ease,background .12s ease,border-color .12s ease;
}
button:active{transform:scale(.94)}
button.primary{
  background:linear-gradient(180deg,#872318,#3d100b);
  border-color:#ff634f;
}

/* Botão de configurações no canto superior direito */
#cfgBtn{
  position:fixed;
  right:12px;
  top:calc(10px + env(safe-area-inset-top,0px));
  width:46px;height:46px;padding:0;border-radius:50%;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  z-index:300;
  background:rgba(24,18,17,0.95);
  border-color:#ff634f;
  box-shadow:0 4px 14px rgba(0,0,0,.65);
}

/* HUD no canto superior esquerdo (sem colisão com botões) */
#hud{
  position:fixed;
  left:10px;
  top:calc(10px + env(safe-area-inset-top,0px));
  z-index:40;
  display:none;
  pointer-events:none;
  max-width:calc(100vw - 76px);
  text-shadow:0 2px 4px #000;
  font-weight:700;font-size:11.5px;
}
#zoneBadge{
  display:inline-block;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,110,90,.55);
  padding:2px 8px;border-radius:6px;
  color:#ffc2b5;font-size:10.5px;margin-bottom:5px;
}
.barsRow{display:flex;flex-direction:column;gap:4px;width:154px}
.bar{
  width:100%;height:9px;
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.22);
  border-radius:5px;overflow:hidden;
}
.bar>i{display:block;height:100%;transition:width .1s linear}
#inf{margin-top:4px;line-height:1.25}
#matsHud{font-size:10.5px;opacity:.9;margin-top:2px}
#quickSlots{
  display:flex;gap:5px;margin-top:6px;
  pointer-events:auto;position:relative;z-index:45;
}
.qSlot{
  width:40px;height:40px;padding:0;border-radius:8px;
  border:1.5px solid #785b49;
  background:rgba(26,20,17,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;font-size:14px;
}
.qSlot small{position:absolute;top:1px;left:3px;font-size:8px;color:#ffd27d}
.qSlot span{position:absolute;bottom:1px;right:3px;font-size:9.5px;font-weight:800;color:#fff}

/* Boss bar & Mira & Flash */
#bbar{
  position:fixed;top:calc(10px + env(safe-area-inset-top,0px));
  left:50%;transform:translateX(-50%);
  width:min(42vw,240px);height:10px;
  background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.35);
  display:none;z-index:40;border-radius:5px;overflow:hidden;pointer-events:none;
}
#bbi{display:block;height:100%;width:0%;background:#b833ff}
#crosshair{
  position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;
  border:1.5px solid rgba(255,255,255,.88);border-radius:50%;
  pointer-events:none;z-index:35;display:none;box-shadow:0 0 4px #000;
}
#hitFlash{
  position:fixed;inset:0;background:rgba(255,0,0,.28);
  opacity:0;pointer-events:none;z-index:60;
}
#msg{
  position:fixed;top:24%;left:0;width:100%;
  text-align:center;font:800 17px/1.2 system-ui,-apple-system,sans-serif;
  text-shadow:0 2px 8px #000;pointer-events:none;
  opacity:0;z-index:250;transition:opacity .2s;padding:0 12px;
}

/* Luneta */
#scopeOverlay{
  position:fixed;inset:0;display:none;pointer-events:none;z-index:36;
  background:radial-gradient(circle at center,transparent 27%,rgba(0,0,0,.78) 28%,#000 100%);
}
#scopeRing{
  position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:min(56vh,56vw);
  transform:translate(-50%,-50%);border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
}
#scopeH{position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:1.5px;background:rgba(255,70,70,.8);transform:translate(-50%,-50%)}
#scopeV{position:fixed;left:50%;top:50%;width:1.5px;height:min(56vh,56vw);background:rgba(255,70,70,.8);transform:translate(-50%,-50%)}
#scopeDot{position:fixed;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#ff3535;transform:translate(-50%,-50%)}
#scopeText{
  position:fixed;left:50%;bottom:calc(16% + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);font-size:11px;font-weight:800;letter-spacing:1.5px;
  color:#ffb1a3;text-shadow:0 2px 4px #000;
}

/* Controles Touch: Coluna direita espaçada (nunca sobrepõe ⚙️ nem HUD) */
#rightControls{
  position:fixed;
  right:12px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:none;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  z-index:90;
  pointer-events:none;
}
.rightMiniRow{
  display:flex;
  gap:8px;
  pointer-events:none;
}
.rightMainRow{
  display:flex;
  align-items:flex-end;
  gap:10px;
  pointer-events:none;
}
.padBtn{
  width:52px;height:52px;padding:0;border-radius:50%;
  font-size:20px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,10,.82);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
  pointer-events:auto;
  touch-action:none;
}
#btnJump{width:60px;height:60px;font-size:24px}
#btnFire{width:68px;height:68px;font-size:28px;border-color:#ff523f;background:rgba(50,12,10,.88)}

/* Controles Touch: Bloco inferior esquerdo (3x2 organizado e sem sobreposição) */
#leftActionGrid{
  position:fixed;
  left:12px;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:none;
  grid-template-columns:repeat(3,46px);
  gap:8px;
  z-index:90;
  pointer-events:none;
}
.topActionBtn{
  width:46px;height:46px;padding:0;border-radius:50%;
  font-size:18px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,10,10,.82);
  box-shadow:0 3px 10px rgba(0,0,0,.6);
  pointer-events:auto;
}

/* Menus e Modais */
.modal{
  position:fixed;inset:0;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:18px;overflow-y:auto;
  background:var(--panel);z-index:200;
}
#menu{
  display:flex;
  background:radial-gradient(circle at center,rgba(0,0,0,.45),rgba(9,6,6,.92));
  text-align:center;z-index:150;
}
#menu h1{
  margin:0;font-size:44px;letter-spacing:4px;color:#ff5442;
  text-shadow:0 0 22px rgba(201,59,43,.75),0 4px 0 #380906;
}
#bestTxt{margin:0;font-size:13px;font-weight:800;color:#ffd27d;letter-spacing:1px}
#engineAlert{
  display:none;max-width:340px;font-size:12px;color:#ff9c8a;
  background:rgba(120,20,15,.45);border:1px solid #ff634f;
  padding:8px 12px;border-radius:8px;
}
.menuStack{display:flex;flex-direction:column;gap:10px;width:240px}
.menuStack button{width:100%;padding:14px 18px;font-size:14px;letter-spacing:1px}

.box{
  background:var(--card);border:2px solid var(--border);
  border-radius:14px;padding:16px;max-width:460px;width:100%;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.75);
}
.box h2{margin:0;text-align:center;color:#ff6b57;font-size:19px}
.rowCard{
  background:rgba(20,16,14,.85);border:1px solid rgba(255,255,255,.1);
  border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;
}
.rowCard label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#ffd6be}
.rowCard input[type=range]{width:100%;accent-color:#ff5442;height:26px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* Inventário */
.invWrap{max-width:860px;width:100%;display:flex;flex-direction:column;gap:10px}
.invTop{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:8px;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:8px;padding-right:52px;
}
.invTop h2{margin:0;color:#ff6b57;font-size:20px}
.pills{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-weight:700}
.pill{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);padding:4px 8px;border-radius:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tabBtn.active{background:#8f2419;border-color:#ff725e}
.invMain{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:start}
@media(max-width:680px){.invMain{grid-template-columns:1fr}}
#invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px}
.slotCard{
  background:#221b18;border:1.5px solid #4f3d33;border-radius:9px;
  padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:5px;min-height:92px;text-align:center;font-size:11px;
}
.slotCard .nm{font-weight:700}
.slotCard .sub{font-size:10px;opacity:.85}
.slotCard button{padding:6px 8px;font-size:10px;width:100%}
</style>
</head>
<body>

<button type="button" id="cfgBtn" aria-label="Configurações">⚙️</button>
<div id="msg"></div>
<div id="hitFlash"></div>
<div id="crosshair"></div>
<div id="bbar"><i id="bbi"></i></div>

<div id="scopeOverlay">
  <div id="scopeRing"></div>
  <div id="scopeH"></div>
  <div id="scopeV"></div>
  <div id="scopeDot"></div>
  <div id="scopeText">LUNETA ATIVA</div>
</div>

<div id="hud">
  <div id="zoneBadge">🏙️ CENTRO DENSO</div>
  <div class="barsRow">
    <div class="bar"><i id="barHp" style="background:#e33;width:100%"></i></div>
    <div class="bar"><i id="barFd" style="background:#e90;width:80%"></i></div>
    <div class="bar"><i id="barWt" style="background:#39e;width:80%"></i></div>
    <div class="bar" style="height:6px"><i id="barSt" style="background:#4e8;width:100%"></i></div>
  </div>
  <div id="inf"></div>
  <div id="matsHud"></div>
  <div id="quickSlots">
    <button type="button" class="qSlot" id="qFood"><small>1</small>🍖<span id="qFoodN">0</span></button>
    <button type="button" class="qSlot" id="qWater"><small>2</small>💧<span id="qWaterN">0</span></button>
    <button type="button" class="qSlot" id="qGr"><small>G</small>💣<span id="qGrN">0</span></button>
    <button type="button" class="qSlot" id="qBb"><small>H</small>🧨<span id="qBbN">0</span></button>
  </div>
</div>

<!-- Controles Touch Direita -->
<div id="rightControls">
  <div class="rightMiniRow">
    <button type="button" class="padBtn" id="btnSlide" title="Deslizar">🛝</button>
    <button type="button" class="padBtn" id="btnDash" title="Dash">⚡</button>
    <button type="button" class="padBtn" id="btnSwap" title="Trocar Arma">🔄</button>
  </div>
  <div class="rightMainRow">
    <button type="button" class="padBtn" id="btnJump" title="Pular">⏫</button>
    <button type="button" class="padBtn" id="btnFire" title="Atirar">🔥</button>
  </div>
</div>

<!-- Controles Touch Esquerda -->
<div id="leftActionGrid">
  <button type="button" class="topActionBtn" id="btnGrenade" title="Granada">💣</button>
  <button type="button" class="topActionBtn" id="btnBomb" title="Bomba">🧨</button>
  <button type="button" class="topActionBtn" id="btnAim" title="Mirar">🎯</button>
  <button type="button" class="topActionBtn" id="btnCraft" title="Craft">🛠️</button>
  <button type="button" class="topActionBtn" id="btnReload" title="Recarregar">🔃</button>
  <button type="button" class="topActionBtn" id="btnInv" title="Inventário">🎒</button>
</div>

<!-- Menu Principal -->
<div id="menu" class="modal">
  <h1>Z-PARKOUR</h1>
  <p id="bestTxt"></p>
  <p id="engineAlert">⚠️ Three.js não carregou. Verifique a conexão com a internet e recarregue.</p>
  <div class="menuStack">
    <button type="button" id="btnContinue" class="primary" style="display:none">CONTINUAR</button>
    <button type="button" id="btnNew" class="primary">▶ NOVO JOGO</button>
  </div>
</div>

<!-- Configurações -->
<div id="cfgModal" class="modal">
  <div class="box">
    <h2>⚙️ CONFIGURAÇÕES</h2>
    <div class="rowCard">
      <label><span>🎯 Sensibilidade</span><span id="sensOut">1.0x</span></label>
      <input type="range" id="sensSlider" min="0.2" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="rowCard">
      <label><span>☀️ Horário</span></label>
      <div class="grid3" id="timeBtns">
        <button type="button" data-h="8">☀ MANHÃ</button>
        <button type="button" data-h="16">🌇 TARDE</button>
        <button type="button" data-h="22">🌙 NOITE</button>
      </div>
    </div>
    <div class="rowCard">
      <label><span>🖥️ Gráficos</span></label>
      <div class="grid2">
        <button type="button" id="btnRtx">✨ RTX: ON</button>
        <button type="button" id="btnPotato">⚙ BATATA: OFF</button>
        <button type="button" id="btnRes">📐 Res: 100%</button>
        <button type="button" id="btnFps">🎞 FPS: 60</button>
        <button type="button" id="btnPx">▦ Pixel: 1x</button>
        <button type="button" id="btnDist">👁 Render: Médio</button>
      </div>
    </div>
    <button type="button" id="btnFs">⛶ TELA CHEIA</button>
    <button type="button" id="btnCfgClose" class="primary">CONCLUÍDO</button>
  </div>
</div>

<!-- Craft -->
<div id="craftModal" class="modal">
  <div class="box" id="craftBox"></div>
</div>

<!-- Inventário -->
<div id="invModal" class="modal">
  <div class="invWrap">
    <div class="invTop">
      <h2>🎒 INVENTÁRIO & ARSENAL</h2>
      <div class="pills" id="invPills"></div>
    </div>
    <div class="tabs">
      <button type="button" class="tabBtn active" data-tab="all">Tudo</button>
      <button type="button" class="tabBtn" data-tab="weapons">Armas</button>
      <button type="button" class="tabBtn" data-tab="items">Itens</button>
      <button type="button" class="tabBtn" data-tab="mats">Materiais</button>
    </div>
    <div class="invMain">
      <div class="box" style="max-width:none">
        <div id="invEquipInfo" style="font-size:12px"></div>
        <div id="invResInfo" style="font-size:12px"></div>
      </div>
      <div id="invGrid"></div>
    </div>
    <button type="button" id="btnInvClose" class="primary" style="align-self:center;min-width:180px">FECHAR INVENTÁRIO</button>
  </div>
</div>

<script>
// ============== 1. UTILITÁRIOS & BOTÕES ==============
const $ = id => document.getElementById(id);
const rand = Math.random;
const SAVE_KEY = 'zparkour3d_v2_save';
const CFG_KEY = 'zparkour3d_v2_cfg';
const memStorage = Object.create(null);

function saveData(key, val) {
  try { localStorage.setItem(key, String(val)); }
  catch (_) { memStorage[key] = String(val); }
}
function loadData(key) {
  try { return localStorage.getItem(key); }
  catch (_) { return memStorage[key] ?? null; }
}

function onTap(el, fn) {
  if (!el) return;
  let lastFire = 0;
  const run = e => {
    const now = Date.now();
    if (now - lastFire < 180) return;
    lastFire = now;
    e.stopPropagation();
    fn(e);
  };
  el.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    run(e);
  });
  el.addEventListener('click', run);
}

function onHold(el, onDown, onUp) {
  if (!el) return;
  let pointerId = null;
  const release = e => {
    if (pointerId !== null && e && e.pointerId !== undefined && e.pointerId !== pointerId) return;
    pointerId = null;
    onUp();
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    pointerId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    onDown();
  });
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', release);
}

let msgTimer = null;
function toast(text) {
  const el = $('msg');
  if (!el) return;
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

// ============== 2. ESTADO DA UI & CONFIGURAÇÕES ==============
const UI = {
  screen: 'menu',
  firing: false,
  aiming: false,
  invTab: 'all',
  cfg: {
    sens: 1.0,
    hr: 16,
    res: 1,
    fps: 60,
    px: 1,
    rd: 150,
    rtx: true,
    potato: false
  }
};

try {
  const savedCfg = JSON.parse(loadData(CFG_KEY) || '{}');
  Object.assign(UI.cfg, savedCfg);
} catch (_) {}

function persistCfg() {
  saveData(CFG_KEY, JSON.stringify(UI.cfg));
}

function releasePointerLockSafe() {
  try {
    if (document.pointerLockElement && document.exitPointerLock) {
      document.exitPointerLock();
    }
  } catch (_) {}
}

function syncScreenVisibility() {
  UI.firing = false;
  $('menu').style.display = UI.screen === 'menu' ? 'flex' : 'none';
  $('cfgModal').style.display = UI.screen === 'cfg' ? 'flex' : 'none';
  $('craftModal').style.display = UI.screen === 'craft' ? 'flex' : 'none';
  $('invModal').style.display = UI.screen === 'inv' ? 'flex' : 'none';

  const playing = UI.screen === 'play';
  const touchCapable = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  $('hud').style.display = playing ? 'block' : 'none';
  $('crosshair').style.display = (playing && !UI.aiming) ? 'block' : 'none';
  $('rightControls').style.display = (playing && touchCapable) ? 'flex' : 'none';
  $('leftActionGrid').style.display = (playing && touchCapable) ? 'grid' : 'none';
  if (!playing) {
    UI.aiming = false;
    $('scopeOverlay').style.display = 'none';
  }
}

let prevScreenBeforeCfg = 'menu';
function openConfig() {
  if (UI.screen === 'cfg') {
    UI.screen = prevScreenBeforeCfg;
    syncScreenVisibility();
    return;
  }
  prevScreenBeforeCfg = UI.screen;
  UI.screen = 'cfg';
  releasePointerLockSafe();
  syncScreenVisibility();
}

function requestFullscreenSafe() {
  try {
    const root = document.documentElement;
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      const p = req.call(root);
      if (p && p.catch) p.catch(() => {});
    }
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (_) {}
}

const Bridge = {
  startGame: () => toast('Carregando motor 3D...'),
  jump: () => {},
  dash: () => {},
  swapWeapon: () => {},
  slide: () => {},
  throwItem: () => {},
  reload: () => {},
  useFood: () => {},
  useWater: () => {},
  renderCraft: () => {},
  renderInv: () => {},
  applyGraphics: () => {}
};

$('sensSlider').value = UI.cfg.sens;
$('sensOut').textContent = Number(UI.cfg.sens).toFixed(1) + 'x';
$('sensSlider').addEventListener('input', e => {
  UI.cfg.sens = parseFloat(e.target.value) || 1.0;
  $('sensOut').textContent = UI.cfg.sens.toFixed(1) + 'x';
  persistCfg();
});

onTap($('cfgBtn'), openConfig);
onTap($('btnCfgClose'), () => {
  UI.screen = prevScreenBeforeCfg === 'cfg' ? 'menu' : prevScreenBeforeCfg;
  syncScreenVisibility();
});
onTap($('btnFs'), requestFullscreenSafe);

onTap($('btnContinue'), () => Bridge.startGame(true));
onTap($('btnNew'), () => Bridge.startGame(false));

onHold($('btnFire'),
  () => { if (UI.screen === 'play') UI.firing = true; },
  () => { UI.firing = false; }
);
onTap($('btnJump'), () => Bridge.jump());
onTap($('btnDash'), () => Bridge.dash());
onTap($('btnSwap'), () => Bridge.swapWeapon(1));
onTap($('btnSlide'), () => Bridge.slide());
onTap($('btnGrenade'), () => Bridge.throwItem(false));
onTap($('btnBomb'), () => Bridge.throwItem(true));
onTap($('btnAim'), () => { if (UI.screen === 'play') UI.aiming = !UI.aiming; });
onTap($('btnReload'), () => Bridge.reload());
onTap($('qFood'), () => Bridge.useFood());
onTap($('qWater'), () => Bridge.useWater());
onTap($('qGr'), () => Bridge.throwItem(false));
onTap($('qBb'), () => Bridge.throwItem(true));

onTap($('btnCraft'), () => {
  if (UI.screen === 'play') {
    UI.screen = 'craft';
    releasePointerLockSafe();
    syncScreenVisibility();
    Bridge.renderCraft();
  } else if (UI.screen === 'craft') {
    UI.screen = 'play';
    syncScreenVisibility();
  }
});

onTap($('btnInv'), () => {
  if (UI.screen === 'play') {
    UI.screen = 'inv';
    releasePointerLockSafe();
    syncScreenVisibility();
    Bridge.renderInv();
  }
});
onTap($('btnInvClose'), () => {
  if (UI.screen === 'inv') {
    UI.screen = 'play';
    syncScreenVisibility();
  }
});

document.querySelectorAll('.tabBtn').forEach(tb => {
  onTap(tb, () => {
    UI.invTab = tb.dataset.tab;
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b === tb));
    Bridge.renderInv();
  });
});

document.querySelectorAll('#timeBtns button').forEach(b => {
  onTap(b, () => {
    UI.cfg.hr = Number(b.dataset.h) || 16;
    persistCfg();
    Bridge.applyGraphics();
    document.querySelectorAll('#timeBtns button').forEach(x => x.style.background = '');
    b.style.background = '#8f2419';
  });
});

const RES_LIST = [0.5, 0.75, 1, 1.25];
const FPS_LIST = [30, 45, 60, 0];
const PX_LIST = [1, 2, 3, 4];
const DIST_LIST = [85, 150, 240, 360];

onTap($('btnRtx'), () => {
  UI.cfg.rtx = !UI.cfg.rtx;
  if (UI.cfg.rtx) UI.cfg.potato = false;
  persistCfg();
  Bridge.applyGraphics();
});
onTap($('btnPotato'), () => {
  UI.cfg.potato = !UI.cfg.potato;
  if (UI.cfg.potato) UI.cfg.rtx = false;
  persistCfg();
  Bridge.applyGraphics();
});
onTap($('btnRes'), () => {
  const i = RES_LIST.indexOf(UI.cfg.res);
  UI.cfg.res = RES_LIST[(i + 1) % RES_LIST.length];
  persistCfg();
  Bridge.applyGraphics();
});
onTap($('btnFps'), () => {
  const i = FPS_LIST.indexOf(UI.cfg.fps);
  UI.cfg.fps = FPS_LIST[(i + 1) % FPS_LIST.length];
  persistCfg();
  Bridge.applyGraphics();
});
onTap($('btnPx'), () => {
  const i = PX_LIST.indexOf(UI.cfg.px);
  UI.cfg.px = PX_LIST[(i + 1) % PX_LIST.length];
  persistCfg();
  Bridge.applyGraphics();
});
onTap($('btnDist'), () => {
  const i = DIST_LIST.indexOf(UI.cfg.rd);
  UI.cfg.rd = DIST_LIST[(i + 1) % DIST_LIST.length];
  persistCfg();
  Bridge.applyGraphics();
});

syncScreenVisibility();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="document.getElementById('engineAlert').style.display='block'"></script>
<script>
// ============== 3. MOTOR 3D & LÓGICA DO JOGO ==============
(() => {
  if (!window.THREE) {
    $('engineAlert').style.display = 'block';
    return;
  }

  const T = THREE;
  const MAP_LIMIT = 340;

  const RARITY = {
    common:    { label: 'Comum',    color: '#b8bcc2', weight: 42 },
    uncommon:  { label: 'Incomum',  color: '#4cd964', weight: 28 },
    rare:      { label: 'Rara',     color: '#4ea8ff', weight: 16 },
    epic:      { label: 'Épica',    color: '#c06cff', weight: 9  },
    legendary: { label: 'Lendária', color: '#ffb703', weight: 5  }
  };

  const WEAPONS = [
    { name: 'Pistola 9mm', rarity: 'common', ammo: '9mm', delay: 0.26, dmg: 2.3, pel: 1, sp: 0.004, mag: 15, rel: 1.0, pool: 30, freq: 240, ty: 'square', model: 'pistol' },
    { name: 'Escopeta Tática', rarity: 'uncommon', ammo: '12G', delay: 0.80, dmg: 1.5, pel: 6, sp: 0.055, mag: 8, rel: 1.8, pool: 16, freq: 105, ty: 'sawtooth', model: 'shotgun' },
    { name: 'Rifle M4A1', rarity: 'rare', ammo: '5.56mm', delay: 0.095, dmg: 1.4, pel: 1, sp: 0.013, mag: 30, rel: 1.7, pool: 60, freq: 195, ty: 'square', model: 'm4' },
    { name: 'SMG MP5', rarity: 'common', ammo: '9mm', delay: 0.068, dmg: 0.9, pel: 1, sp: 0.026, mag: 30, rel: 1.4, pool: 60, freq: 310, ty: 'square', model: 'smg' },
    { name: 'Sniper M24', rarity: 'rare', ammo: '7.62mm', delay: 1.10, dmg: 9.5, pel: 1, sp: 0.0005, mag: 5, rel: 2.0, pool: 12, freq: 90, ty: 'sawtooth', scope: true, zoom: 16, model: 'sniper' },
    { name: 'Magnum .44', rarity: 'rare', ammo: '.44', delay: 0.52, dmg: 5.8, pel: 1, sp: 0.007, mag: 6, rel: 1.5, pool: 12, freq: 130, ty: 'square', model: 'revolver' },
    { name: 'Fuzil AK-47', rarity: 'uncommon', ammo: '7.62mm', delay: 0.092, dmg: 1.75, pel: 1, sp: 0.022, mag: 30, rel: 1.7, pool: 60, freq: 155, ty: 'sawtooth', model: 'ak47' },
    { name: 'DMR Mk14', rarity: 'epic', ammo: '7.62mm', delay: 0.30, dmg: 4.0, pel: 1, sp: 0.003, mag: 12, rel: 1.7, pool: 24, freq: 125, ty: 'square', scope: true, zoom: 26, model: 'sniper' },
    { name: 'Minigun M134', rarity: 'legendary', ammo: '7.62mm', delay: 0.042, dmg: 1.1, pel: 1, sp: 0.050, mag: 100, rel: 2.6, pool: 150, freq: 140, ty: 'sawtooth', model: 'minigun' },
    { name: 'Katana Afiada', rarity: 'legendary', ammo: 'Lâmina', delay: 0.28, dmg: 5.6, pel: 1, sp: 0, mag: 1, rel: 0.1, pool: 0, freq: 220, ty: 'triangle', melee: true, rng: 3.4, model: 'katana' },
    { name: 'Facão de Selva', rarity: 'common', ammo: 'Lâmina', delay: 0.34, dmg: 4.2, pel: 1, sp: 0, mag: 1, rel: 0.1, pool: 0, freq: 190, ty: 'triangle', melee: true, rng: 3.0, model: 'machete' },
    { name: 'Marreta Pesada', rarity: 'rare', ammo: 'Impacto', delay: 0.65, dmg: 9.5, pel: 1, sp: 0, mag: 1, rel: 0.1, pool: 0, freq: 120, ty: 'sawtooth', melee: true, rng: 3.2, model: 'hammer' }
  ];

  const DROP_POOL = [];
  WEAPONS.forEach((w, idx) => {
    if (idx === 0) return;
    const wt = RARITY[w.rarity]?.weight || 10;
    for (let i = 0; i < wt; i++) DROP_POOL.push(idx);
  });
  const pickRandomWeaponIdx = () => DROP_POOL[Math.floor(rand() * DROP_POOL.length)] ?? 1;

  // Áudio
  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = new Ctx();
  }
  function beep(freq, dur, type = 'sine', vol = 0.12, slide = 1) {
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(30, freq), now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(25, freq * slide), now + dur);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    } catch (_) {}
  }

  // Cena e Renderer
  const scene = new T.Scene();
  scene.background = new T.Color(0x6b3c2d);
  scene.fog = new T.FogExp2(0x6b3c2d, 0.011);

  const camera = new T.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 220);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputEncoding = T.sRGBEncoding;
  document.body.prepend(renderer.domElement);

  const hemi = new T.HemisphereLight(0xffcf9e, 0x1d2636, 1.0);
  scene.add(hemi);
  const sun = new T.DirectionalLight(0xffb469, 1.2);
  sun.position.set(45, 65, 25);
  scene.add(sun);
  scene.add(sun.target);

  const flashLight = new T.PointLight(0xffaa55, 0, 14);
  camera.add(flashLight);

  // ============== TEXTURAS PROCEDURAIS RICAS ==============
  function makeCanvasTex(w, h, drawFn, rx = 1, ry = 1) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    drawFn(c.getContext('2d'), w, h);
    const tex = new T.CanvasTexture(c);
    tex.wrapS = tex.wrapT = T.RepeatWrapping;
    tex.repeat.set(rx, ry);
    return tex;
  }

  function addNoise(ctx, w, h, count, colors) {
    for (let i = 0; i < count; i++) {
      ctx.globalAlpha = 0.14 + rand() * 0.28;
      ctx.fillStyle = colors[i % colors.length];
      ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 3, 1 + rand() * 3);
    }
    ctx.globalAlpha = 1;
  }

  const groundTex = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#3b3934'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#25231f'; ctx.lineWidth = 2;
    for (let i = 0; i <= w; i += 32) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
    }
    addNoise(ctx, w, h, 400, ['#22201c', '#524f47', '#2f2d28']);
  }, 90, 90);

  const roadTex = makeCanvasTex(256, 64, (ctx, w, h) => {
    ctx.fillStyle = '#202227'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#6c6962'; ctx.fillRect(0, 0, w, 7); ctx.fillRect(0, h - 7, w, 7);
    ctx.fillStyle = '#d8ae28';
    for (let x = 8; x < w; x += 32) ctx.fillRect(x, h / 2 - 1.5, 16, 3);
    addNoise(ctx, w, h, 350, ['#121317', '#32353d']);
  }, 40, 1);

  // Parede externa de prédio com textura de tijolo/concreto e janelas
  const extWallTex = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#6a4636'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.32)'; ctx.lineWidth = 2;
    for (let y = 0; y < h; y += 16) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    addNoise(ctx, w, h, 900, ['#3b2419', '#8a5e49', '#241711']);
    for (let gx = 16; gx < w; gx += 64) {
      for (let gy = 16; gy < h; gy += 64) {
        ctx.fillStyle = '#1d1f24';
        ctx.fillRect(gx - 3, gy - 3, 38, 42);
        ctx.fillStyle = ((gx + gy) % 128 === 0) ? '#ffd269' : '#24313d';
        ctx.fillRect(gx, gy, 32, 36);
        ctx.fillStyle = '#8b8780';
        ctx.fillRect(gx - 4, gy + 36, 40, 5);
      }
    }
  }, 1, 1);

  // Parede interna dos prédios (reboco envelhecido, rodapé e manchas)
  const intWallTex = makeCanvasTex(256, 256, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#c8beae');
    g.addColorStop(0.78, '#b2a694');
    g.addColorStop(0.79, '#5e432c');
    g.addColorStop(1, '#47311f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // Faixa decorativa e moldura
    ctx.fillStyle = '#8f7d69';
    ctx.fillRect(0, h * 0.48, w, 6);
    // Rachaduras e manchas
    ctx.strokeStyle = 'rgba(55,45,35,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(45, 30); ctx.lineTo(62, 74); ctx.lineTo(54, 118);
    ctx.moveTo(190, 60); ctx.lineTo(175, 108); ctx.lineTo(188, 145);
    ctx.stroke();
    addNoise(ctx, w, h, 800, ['#8c8070', '#dfd6c7', '#61564a']);
  }, 2, 1);

  // Piso interno de madeira detalhada
  const intFloorTex = makeCanvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = '#6b4423'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = i % 2 ? '#593619' : '#7a502b';
      ctx.fillRect(0, i * 16, w, 15);
      ctx.fillStyle = '#3a210d';
      ctx.fillRect(0, i * 16 + 15, w, 1);
      ctx.fillRect((i * 53) % w, i * 16, 2, 16);
    }
    addNoise(ctx, w, h, 600, ['#3d230e', '#8f6239']);
  }, 3, 3);

  const crateTex = makeCanvasTex(64, 64, (ctx, w, h) => {
    ctx.fillStyle = '#754920'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#3f240b'; ctx.lineWidth = 5;
    ctx.strokeRect(3, 3, w - 6, h - 6);
    ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(w - 4, h - 4); ctx.stroke();
  }, 1, 1);

  // Texturas detalhadas dos Zumbis
  const zSkinTex = makeCanvasTex(128, 128, (ctx, w, h) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#7c9e66');
    g.addColorStop(0.55, '#597a45');
    g.addColorStop(1, '#3b542c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // Veias e feridas
    ctx.strokeStyle = '#2d4220'; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      ctx.beginPath(); ctx.moveTo(rand() * w, rand() * h); ctx.lineTo(rand() * w, rand() * h); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(130,18,18,0.5)';
    for (let i = 0; i < 7; i++) {
      ctx.beginPath(); ctx.arc(rand() * w, rand() * h, 4 + rand() * 8, 0, Math.PI * 2); ctx.fill();
    }
    addNoise(ctx, w, h, 450, ['#2b4220', '#96b87f', '#5e1111']);
  });

  const zFaceTex = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#6b8e55';
    ctx.fillRect(0, 0, w, h);
    addNoise(ctx, w, h, 350, ['#4a6638', '#86a86e', '#5a1414']);
    // Sobrancelhas fundas
    ctx.fillStyle = '#2c3d21';
    ctx.fillRect(22, 34, 32, 9);
    ctx.fillRect(74, 34, 32, 9);
    // Olhos fundos e pupilas amarelas
    ctx.fillStyle = '#181111';
    ctx.fillRect(26, 43, 24, 16);
    ctx.fillRect(78, 43, 24, 16);
    ctx.fillStyle = '#ffe44d';
    ctx.fillRect(33, 47, 10, 8);
    ctx.fillRect(85, 47, 10, 8);
    // Nariz decomposto
    ctx.fillStyle = '#2b3822';
    ctx.beginPath(); ctx.moveTo(64, 58); ctx.lineTo(56, 74); ctx.lineTo(72, 74); ctx.closePath(); ctx.fill();
    // Boca aberta com sangue e dentes
    ctx.fillStyle = '#2b0606';
    ctx.fillRect(36, 82, 56, 26);
    ctx.fillStyle = '#8f1111';
    ctx.fillRect(34, 106, 60, 7);
    ctx.fillStyle = '#ebe2c7';
    for (let i = 0; i < 5; i++) ctx.fillRect(40 + i * 10, 82, 6, 7);
    for (let i = 0; i < 4; i++) ctx.fillRect(44 + i * 11, 101, 6, 7);
  });

  const zClothesTex = makeCanvasTex(128, 128, (ctx, w, h) => {
    ctx.fillStyle = '#384c66';
    ctx.fillRect(0, 0, w, h);
    // Sujeira e rasgos
    ctx.fillStyle = 'rgba(20,22,26,0.38)';
    ctx.fillRect(0, h * 0.65, w, h * 0.35);
    ctx.fillStyle = 'rgba(125,16,16,0.52)';
    ctx.beginPath(); ctx.arc(w * 0.32, h * 0.42, 18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.72, h * 0.58, 13, 0, Math.PI * 2); ctx.fill();
    addNoise(ctx, w, h, 450, ['#1c2633', '#526b8c', '#631010']);
  });

  const groundMesh = new T.Mesh(
    new T.PlaneGeometry(MAP_LIMIT * 2, MAP_LIMIT * 2),
    new T.MeshStandardMaterial({ map: groundTex, roughness: 0.88 })
  );
  groundMesh.rotation.x = -Math.PI / 2;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  // Ruas
  const roadMat = new T.MeshStandardMaterial({ map: roadTex, roughness: 0.55 });
  for (let k = -6; k <= 6; k++) {
    const r1 = new T.Mesh(new T.PlaneGeometry(MAP_LIMIT * 2, 12), roadMat);
    r1.rotation.x = -Math.PI / 2;
    r1.position.set(0, 0.02, k * 48);
    scene.add(r1);

    const r2 = new T.Mesh(new T.PlaneGeometry(MAP_LIMIT * 2, 12), roadMat);
    r2.rotation.x = -Math.PI / 2;
    r2.rotation.z = Math.PI / 2;
    r2.position.set(k * 48, 0.02, 0);
    scene.add(r2);
  }

  // Obstáculos e construções com paredes grossas e interior
  const boxes = [];
  const pickups = [];
  let zombies = [];
  let bombs = [];

  const extWallMat = new T.MeshStandardMaterial({ map: extWallTex, roughness: 0.72 });
  const intWallMat = new T.MeshStandardMaterial({ map: intWallTex, roughness: 0.78 });
  const intFloorMat = new T.MeshStandardMaterial({ map: intFloorTex, roughness: 0.8 });
  const roofMat = new T.MeshStandardMaterial({ color: 0x35383e, roughness: 0.7 });
  const crateMat = new T.MeshStandardMaterial({ map: crateTex, roughness: 0.7 });

  function addObstacle(x, z, w, d, h, matOrTex, y0 = 0) {
    let mat = matOrTex;
    if (matOrTex && matOrTex.isTexture) {
      mat = new T.MeshStandardMaterial({ map: matOrTex, roughness: 0.74 });
    } else if (typeof matOrTex === 'number') {
      mat = new T.MeshStandardMaterial({ color: matOrTex, roughness: 0.68 });
    }
    const mesh = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y0 + h / 2, z);
    mesh.castShadow = !UI.cfg.potato;
    mesh.receiveShadow = !UI.cfg.potato;
    scene.add(mesh);
    boxes.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, top: y0 + h, bot: y0, mesh, cx: x, cz: z });
    return mesh;
  }

  // Prédio oco com paredes grossas (1.2m), porta de entrada, interior texturizado e telhado acessível
  function buildThickBuilding(cx, cz, w, d, h) {
    const wallT = 1.2; // Paredes bem grossas
    const doorW = 3.2;
    const doorH = 2.6;

    // Parede Norte (traseira)
    addObstacle(cx, cz - d / 2 + wallT / 2, w, wallT, h, extWallMat, 0);
    // Revestimento interno Norte
    const inN = new T.Mesh(new T.PlaneGeometry(w - wallT * 2, h), intWallMat);
    inN.position.set(cx, h / 2, cz - d / 2 + wallT + 0.03);
    scene.add(inN);

    // Parede Sul (frontal com porta central)
    const sideW = (w - doorW) / 2;
    addObstacle(cx - doorW / 2 - sideW / 2, cz + d / 2 - wallT / 2, sideW, wallT, h, extWallMat, 0);
    addObstacle(cx + doorW / 2 + sideW / 2, cz + d / 2 - wallT / 2, sideW, wallT, h, extWallMat, 0);
    if (h > doorH) {
      addObstacle(cx, cz + d / 2 - wallT / 2, doorW, wallT, h - doorH, extWallMat, doorH);
    }

    // Parede Oeste
    addObstacle(cx - w / 2 + wallT / 2, cz, wallT, d - wallT * 2, h, extWallMat, 0);
    const inW = new T.Mesh(new T.PlaneGeometry(d - wallT * 2, h), intWallMat);
    inW.rotation.y = Math.PI / 2;
    inW.position.set(cx - w / 2 + wallT + 0.03, h / 2, cz);
    scene.add(inW);

    // Parede Leste
    addObstacle(cx + w / 2 - wallT / 2, cz, wallT, d - wallT * 2, h, extWallMat, 0);
    const inE = new T.Mesh(new T.PlaneGeometry(d - wallT * 2, h), intWallMat);
    inE.rotation.y = -Math.PI / 2;
    inE.position.set(cx + w / 2 - wallT - 0.03, h / 2, cz);
    scene.add(inE);

    // Piso interno de madeira texturizada
    const floor = new T.Mesh(new T.PlaneGeometry(w - wallT * 1.8, d - wallT * 1.8), intFloorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(cx, 0.04, cz);
    floor.receiveShadow = true;
    scene.add(floor);

    // Laje do teto espessa (0.65m)
    addObstacle(cx, cz, w + 0.4, d + 0.4, 0.65, roofMat, h);

    // Escada de caixas externas para subir no telhado (parkour)
    addObstacle(cx - w / 2 - 1.3, cz - 2.2, 2.2, 2.2, 1.35, crateMat, 0);
    addObstacle(cx - w / 2 - 1.3, cz + 0.3, 2.2, 2.2, 2.7, crateMat, 0);
    addObstacle(cx - w / 2 - 1.3, cz + 2.8, 2.2, 2.2, 4.1, crateMat, 0);

    // Mobília interna (mesas/caixotes) + loot interno e no telhado
    addObstacle(cx + w * 0.2, cz - d * 0.18, 2.0, 1.1, 0.9, crateMat, 0);
    spawnPickup(cx, cz, ['f', 'd', 'a', 'r', 'w'][Math.floor(rand() * 5)]);
    spawnPickup(cx - 2.0, cz - 1.5, ['a', 'r', 'f'][Math.floor(rand() * 3)]);
  }

  function spawnPickup(x, z, kind) {
    if (isBlocked(x, z, 0, 0.45)) return;
    const colors = { f: 0xd94136, d: 0x2b88d9, a: 0x6ba32d, r: 0xb0b5ba, w: 0xffb703 };
    const mesh = new T.Mesh(
      new T.BoxGeometry(0.65, 0.45, 0.65),
      new T.MeshStandardMaterial({ color: colors[kind] || 0xffffff, emissive: colors[kind] || 0x222222, emissiveIntensity: 0.25 })
    );
    mesh.position.set(x, 0.35, z);
    scene.add(mesh);
    pickups.push({ x, z, kind, mesh });
  }

  function buildCity() {
    for (let i = -3; i <= 3; i++) {
      for (let j = -3; j <= 3; j++) {
        if (i === 0 && j === 0) continue;
        const cx = i * 48 + 18;
        const cz = j * 48 + 18;
        const w = 13 + Math.floor(rand() * 4);
        const d = 13 + Math.floor(rand() * 4);
        const h = 4.6 + Math.floor(rand() * 4) * 1.4;
        buildThickBuilding(cx, cz, w, d, h);
      }
    }
    for (let k = 0; k < 95; k++) {
      const x = (rand() - 0.5) * MAP_LIMIT * 1.55;
      const z = (rand() - 0.5) * MAP_LIMIT * 1.55;
      if (Math.hypot(x, z) < 9 || isBlocked(x, z, 0, 1.5)) continue;
      addObstacle(x, z, 1.8, 1.8, 1.1 + rand() * 1.1, crateMat, 0);
      if (k % 2 === 0) spawnPickup(x + 1.2, z, ['f', 'd', 'a', 'r'][k % 4]);
    }
  }

  function isBlocked(x, z, y, rad) {
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (x > b.x0 - rad && x < b.x1 + rad && z > b.z0 - rad && z < b.z1 + rad) {
        if (y < b.top - 0.35 && y + 1.75 > b.bot) return b;
      }
    }
    return null;
  }

  function getFloorHeight(x, z, y, rad = 0.35) {
    let floor = 0;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (x > b.x0 - rad && x < b.x1 + rad && z > b.z0 - rad && z < b.z1 + rad) {
        if (y >= b.top - 0.4 && b.top > floor) floor = b.top;
      }
    }
    return floor;
  }

  // ============== MODELOS 3D DETALHADOS DAS ARMAS ==============
  const matMetalDark = new T.MeshStandardMaterial({ color: 0x22252b, metalness: 0.72, roughness: 0.32 });
  const matSteel = new T.MeshStandardMaterial({ color: 0x9aa2ac, metalness: 0.85, roughness: 0.22 });
  const matWood = new T.MeshStandardMaterial({ color: 0x6b3f1d, metalness: 0.08, roughness: 0.72 });
  const matPoly = new T.MeshStandardMaterial({ color: 0x2b302a, metalness: 0.15, roughness: 0.6 });
  const matGold = new T.MeshStandardMaterial({ color: 0xd4a638, metalness: 0.88, roughness: 0.2 });
  const matScopeLens = new T.MeshBasicMaterial({ color: 0x33b5ff });

  const gunGroup = new T.Group();
  gunGroup.position.set(0.26, -0.24, -0.52);
  camera.add(gunGroup);

  function addPart(group, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
    const m = new T.Mesh(geo, mat);
    m.position.set(x, y, z);
    if (rx) m.rotation.x = rx;
    if (ry) m.rotation.y = ry;
    if (rz) m.rotation.z = rz;
    group.add(m);
    return m;
  }

  function rebuildWeaponModel(weapon) {
    while (gunGroup.children.length) gunGroup.remove(gunGroup.children[0]);
    const type = weapon ? weapon.model : 'pistol';

    if (type === 'pistol' || type === 'revolver') {
      const slideMat = type === 'revolver' ? matSteel : matMetalDark;
      addPart(gunGroup, new T.BoxGeometry(0.065, 0.075, 0.32), slideMat, 0, 0.02, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.058, 0.035, 0.30), matPoly, 0, -0.03, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.055, 0.17, 0.085), matPoly, 0, -0.12, 0.06, 0.24);
      const barrel = new T.CylinderGeometry(0.015, 0.015, 0.18, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.028, -0.24);
      if (type === 'revolver') {
        const cyl = new T.CylinderGeometry(0.038, 0.038, 0.09, 10); cyl.rotateX(Math.PI / 2);
        addPart(gunGroup, cyl, matMetalDark, 0, 0.01, -0.06);
      }
    } else if (type === 'shotgun') {
      addPart(gunGroup, new T.BoxGeometry(0.07, 0.09, 0.34), matWood, 0, -0.03, 0.28, -0.18);
      addPart(gunGroup, new T.BoxGeometry(0.075, 0.085, 0.36), matMetalDark, 0, 0.01, -0.02);
      const barrel = new T.CylinderGeometry(0.02, 0.02, 0.56, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.035, -0.44);
      const tube = new T.CylinderGeometry(0.016, 0.016, 0.48, 8); tube.rotateX(Math.PI / 2);
      addPart(gunGroup, tube, matMetalDark, 0, 0.0, -0.40);
      addPart(gunGroup, new T.BoxGeometry(0.082, 0.065, 0.22), matWood, 0, -0.005, -0.36);
    } else if (type === 'ak47') {
      addPart(gunGroup, new T.BoxGeometry(0.075, 0.10, 0.32), matWood, 0, -0.025, 0.30, -0.15);
      addPart(gunGroup, new T.BoxGeometry(0.078, 0.095, 0.42), matMetalDark, 0, 0.01, -0.02);
      addPart(gunGroup, new T.BoxGeometry(0.072, 0.07, 0.24), matWood, 0, 0.005, -0.34);
      const barrel = new T.CylinderGeometry(0.015, 0.015, 0.42, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.022, -0.60);
      // Carregador curvado
      addPart(gunGroup, new T.BoxGeometry(0.055, 0.22, 0.085), matMetalDark, 0, -0.14, -0.12, -0.28);
      addPart(gunGroup, new T.BoxGeometry(0.052, 0.14, 0.075), matWood, 0, -0.11, 0.08, 0.22);
    } else if (type === 'm4' || type === 'smg') {
      const len = type === 'smg' ? 0.32 : 0.46;
      addPart(gunGroup, new T.BoxGeometry(0.072, 0.095, 0.28), matPoly, 0, -0.01, 0.28);
      addPart(gunGroup, new T.BoxGeometry(0.076, 0.095, len), matMetalDark, 0, 0.01, -0.04);
      // Trilho tático e mira holográfica
      addPart(gunGroup, new T.BoxGeometry(0.06, 0.02, len * 0.85), matSteel, 0, 0.065, -0.05);
      addPart(gunGroup, new T.BoxGeometry(0.055, 0.045, 0.09), matPoly, 0, 0.09, 0.02);
      const barrel = new T.CylinderGeometry(0.014, 0.014, type === 'smg' ? 0.22 : 0.38, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.02, type === 'smg' ? -0.30 : -0.44);
      addPart(gunGroup, new T.BoxGeometry(0.05, 0.21, 0.075), matPoly, 0, -0.13, -0.08, -0.12);
    } else if (type === 'sniper') {
      addPart(gunGroup, new T.BoxGeometry(0.075, 0.105, 0.36), matPoly, 0, -0.02, 0.32, -0.1);
      addPart(gunGroup, new T.BoxGeometry(0.078, 0.09, 0.48), matMetalDark, 0, 0.01, -0.04);
      const barrel = new T.CylinderGeometry(0.015, 0.018, 0.62, 8); barrel.rotateX(Math.PI / 2);
      addPart(gunGroup, barrel, matSteel, 0, 0.024, -0.56);
      // Luneta óptica com lente azul
      const scope = new T.CylinderGeometry(0.028, 0.024, 0.34, 10); scope.rotateX(Math.PI / 2);
      addPart(gunGroup, scope, matMetalDark, 0, 0.095, -0.06);
      const lens = new T.CylinderGeometry(0.024, 0.024, 0.01, 10); lens.rotateX(Math.PI / 2);
      addPart(gunGroup, lens, matScopeLens, 0, 0.095, -0.232);
    } else if (type === 'minigun') {
      addPart(gunGroup, new T.BoxGeometry(0.16, 0.16, 0.42), matMetalDark, 0, -0.02, 0.02);
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2;
        const b = new T.CylinderGeometry(0.013, 0.013, 0.64, 6); b.rotateX(Math.PI / 2);
        addPart(gunGroup, b, matSteel, Math.cos(ang) * 0.045, -0.02 + Math.sin(ang) * 0.045, -0.48);
      }
      const ring = new T.CylinderGeometry(0.065, 0.065, 0.04, 12); ring.rotateX(Math.PI / 2);
      addPart(gunGroup, ring, matGold, 0, -0.02, -0.68);
    } else if (type === 'katana' || type === 'machete') {
      const bladeLen = type === 'katana' ? 0.78 : 0.54;
      const grip = new T.CylinderGeometry(0.022, 0.024, 0.24, 8); grip.rotateX(Math.PI / 2);
      addPart(gunGroup, grip, matPoly, 0, -0.04, 0.14);
      addPart(gunGroup, new T.BoxGeometry(0.08, 0.08, 0.025), matGold, 0, -0.03, 0.01);
      addPart(gunGroup, new T.BoxGeometry(0.016, 0.065, bladeLen), matSteel, 0, -0.01, -bladeLen / 2, -0.06);
    } else if (type === 'hammer') {
      const shaft = new T.CylinderGeometry(0.024, 0.026, 0.68, 8); shaft.rotateX(Math.PI / 2);
      addPart(gunGroup, shaft, matWood, 0, -0.04, -0.08);
      addPart(gunGroup, new T.BoxGeometry(0.18, 0.13, 0.20), matMetalDark, 0, 0.01, -0.40);
      addPart(gunGroup, new T.BoxGeometry(0.20, 0.11, 0.04), matSteel, 0, 0.01, -0.50);
    }
  }

  // ============== ZUMBIS ARTICULADOS COM TEXTURA ==============
  const zSkinMat = new T.MeshStandardMaterial({ map: zSkinTex, roughness: 0.68 });
  const zFaceMat = new T.MeshStandardMaterial({ map: zFaceTex, roughness: 0.62 });
  const zClothesMat = new T.MeshStandardMaterial({ map: zClothesTex, roughness: 0.8 });
  const zPantsMat = new T.MeshStandardMaterial({ color: 0x263447, roughness: 0.82 });
  const zShoeMat = new T.MeshStandardMaterial({ color: 0x161618, roughness: 0.75 });
  const zHairMat = new T.MeshStandardMaterial({ color: 0x1b140f, roughness: 0.88 });

  // Geometrias compartilhadas para otimizar memória e FPS
  const geoTorso = new T.BoxGeometry(0.64, 0.86, 0.34);
  const geoHead = new T.BoxGeometry(0.42, 0.44, 0.42);
  const geoHair = new T.BoxGeometry(0.44, 0.10, 0.44);
  const geoArm = new T.BoxGeometry(0.18, 0.18, 0.66);
  const geoLeg = new T.BoxGeometry(0.21, 0.68, 0.22);
  const geoShoe = new T.BoxGeometry(0.23, 0.12, 0.34);

  function spawnZombie(x, z, hp, speed, isBoss = false) {
    const g = new T.Group();

    const torso = new T.Mesh(geoTorso, zClothesMat);
    torso.position.y = 1.24;
    torso.castShadow = !UI.cfg.potato;

    const headMaterials = [zSkinMat, zSkinMat, zHairMat, zSkinMat, zFaceMat, zSkinMat];
    const head = new T.Mesh(geoHead, headMaterials);
    head.position.y = 1.94;
    head.userData.isHead = true;

    const hair = new T.Mesh(geoHair, zHairMat);
    hair.position.y = 2.18;

    const armL = new T.Mesh(geoArm, zSkinMat);
    armL.position.set(-0.43, 1.48, 0.28);
    armL.rotation.x = 0.15;

    const armR = new T.Mesh(geoArm, zSkinMat);
    armR.position.set(0.43, 1.48, 0.28);
    armR.rotation.x = 0.15;

    const legL = new T.Group();
    legL.position.set(-0.17, 0.78, 0);
    const legLMesh = new T.Mesh(geoLeg, zPantsMat);
    legLMesh.position.y = -0.34;
    const shoeL = new T.Mesh(geoShoe, zShoeMat);
    shoeL.position.set(0, -0.70, 0.05);
    legL.add(legLMesh, shoeL);

    const legR = new T.Group();
    legR.position.set(0.17, 0.78, 0);
    const legRMesh = new T.Mesh(geoLeg, zPantsMat);
    legRMesh.position.y = -0.34;
    const shoeR = new T.Mesh(geoShoe, zShoeMat);
    shoeR.position.set(0, -0.70, 0.05);
    legR.add(legRMesh, shoeR);

    g.add(torso, head, hair, armL, armR, legL, legR);
    g.position.set(x, 0, z);
    if (isBoss) g.scale.setScalar(2.15);

    g.userData = {
      hp, maxHp: hp, speed, isBoss,
      dead: false, deadTimer: 0, phase: rand() * 6.28,
      limbs: { armL, armR, legL, legR, head }
    };
    scene.add(g);
    zombies.push(g);
  }

  // ============== ESTADO DO JOGADOR ==============
  let gameState = null;

  function makeDefaultState() {
    return {
      x: 0, y: 0, z: 0, vy: 0,
      yaw: 0, pitch: 0,
      hp: 100, food: 80, water: 80, stamina: 100,
      wIdx: 0,
      owned: WEAPONS.map((_, i) => i === 0 || i === 10),
      mag: WEAPONS.map(w => w.mag),
      ammo: WEAPONS.map(w => w.pool),
      mats: { m: 5, w: 3, c: 2, g: 3, food: 1, water: 1, gr: 2, bb: 1 },
      kills: 0, score: 0, combo: 0,
      cd: 0, reloadTimer: 0, reloadIdx: 0,
      dashTimer: 0, dashCd: 0, slideTimer: 0,
      airJumps: 1, wasAir: false, airStreak: false,
      lastBossWave: 0, hordeTimer: 65, saveTimer: 0
    };
  }

  function saveGame(clearRun = false) {
    if (!gameState) return;
    const bestPrev = Number(loadData('zparkour3d_best') || 0);
    const best = Math.max(bestPrev, gameState.score);
    saveData('zparkour3d_best', best);
    if (clearRun) {
      saveData(SAVE_KEY, '');
      $('btnContinue').style.display = 'none';
    } else {
      saveData(SAVE_KEY, JSON.stringify({
        hp: gameState.hp, food: gameState.food, water: gameState.water,
        wIdx: gameState.wIdx, owned: gameState.owned, mag: gameState.mag, ammo: gameState.ammo,
        mats: gameState.mats, kills: gameState.kills, score: gameState.score
      }));
      $('btnContinue').style.display = 'block';
    }
    $('bestTxt').textContent = best > 0 ? 'RECORDE: ' + best : '';
  }

  function clearEntities() {
    zombies.forEach(z => scene.remove(z));
    zombies = [];
    bombs.forEach(b => scene.remove(b.mesh));
    bombs = [];
  }

  function resetWorld(useSave) {
    clearEntities();
    gameState = makeDefaultState();
    if (useSave) {
      try {
        const raw = JSON.parse(loadData(SAVE_KEY) || 'null');
        if (raw && raw.hp > 0) {
          gameState.hp = Math.min(100, Math.max(10, raw.hp));
          gameState.food = raw.food ?? 80;
          gameState.water = raw.water ?? 80;
          gameState.wIdx = (raw.wIdx >= 0 && raw.wIdx < WEAPONS.length) ? raw.wIdx : 0;
          if (Array.isArray(raw.owned) && raw.owned.length === WEAPONS.length) gameState.owned = raw.owned;
          if (Array.isArray(raw.mag) && raw.mag.length === WEAPONS.length) gameState.mag = raw.mag;
          if (Array.isArray(raw.ammo) && raw.ammo.length === WEAPONS.length) gameState.ammo = raw.ammo;
          if (raw.mats) Object.assign(gameState.mats, raw.mats);
          gameState.kills = raw.kills || 0;
          gameState.score = raw.score || 0;
        }
      } catch (_) {}
    }
    rebuildWeaponModel(WEAPONS[gameState.wIdx]);
    for (let i = 0; i < 12; i++) spawnNearbyZombie();
  }

  function spawnNearbyZombie(forcedAngle = null) {
    if (!gameState) return;
    const wave = 1 + Math.floor(gameState.kills / 10);
    for (let attempt = 0; attempt < 15; attempt++) {
      const ang = forcedAngle !== null ? forcedAngle + (rand() - 0.5) * 0.6 : rand() * Math.PI * 2;
      const dist = 16 + rand() * 14;
      const x = gameState.x + Math.cos(ang) * dist;
      const z = gameState.z + Math.sin(ang) * dist;
      if (Math.abs(x) > MAP_LIMIT - 4 || Math.abs(z) > MAP_LIMIT - 4) continue;
      if (!isBlocked(x, z, 0, 0.6)) {
        const hp = (3.5 + wave * 0.5) * (0.85 + rand() * 0.4);
        const speed = (2.3 + wave * 0.14) * (0.85 + rand() * 0.4);
        spawnZombie(x, z, hp, speed, false);
        return;
      }
    }
  }

  function spawnBoss() {
    if (!gameState) return;
    const wave = 1 + Math.floor(gameState.kills / 10);
    const ang = rand() * Math.PI * 2;
    const x = Math.max(-MAP_LIMIT + 6, Math.min(MAP_LIMIT - 6, gameState.x + Math.cos(ang) * 24));
    const z = Math.max(-MAP_LIMIT + 6, Math.min(MAP_LIMIT - 6, gameState.z + Math.sin(ang) * 24));
    spawnZombie(x, z, 42 + wave * 7, 2.2, true);
    toast('☠ CHEFE APARECEU!');
    beep(55, 1.2, 'sawtooth', 0.25, 0.5);
  }

  // Ações do jogador
  function doJump() {
    if (UI.screen !== 'play' || !gameState) return;
    ensureAudio();
    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    const onGround = gameState.vy === 0 && gameState.y <= floor + 0.04;
    if (onGround) {
      gameState.vy = 8.8;
      gameState.airJumps = 1;
      gameState.airStreak = false;
      beep(270, 0.08, 'sine', 0.09, 1.3);
    } else if (gameState.airJumps > 0 && gameState.stamina >= 20) {
      gameState.airJumps--;
      gameState.stamina -= 20;
      gameState.vy = 8.3;
      gameState.airStreak = true;
      beep(440, 0.1, 'triangle', 0.1, 1.6);
    }
  }

  function doDash() {
    if (UI.screen !== 'play' || !gameState) return;
    ensureAudio();
    if (gameState.dashCd <= 0 && gameState.stamina >= 25) {
      gameState.dashTimer = 0.18;
      gameState.dashCd = 0.8;
      gameState.stamina -= 25;
      gameState.airStreak = true;
      beep(190, 0.14, 'sawtooth', 0.12, 2.0);
    }
  }

  function doSlide() {
    if (UI.screen !== 'play' || !gameState) return;
    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    if (gameState.slideTimer <= 0 && gameState.y <= floor + 0.05) {
      gameState.slideTimer = 0.7;
      beep(110, 0.25, 'sawtooth', 0.09, 0.5);
    }
  }

  function doSwapWeapon(dir = 1) {
    if (UI.screen !== 'play' || !gameState) return;
    const n = WEAPONS.length;
    for (let step = 1; step <= n; step++) {
      const idx = (gameState.wIdx + dir * step + n * 4) % n;
      if (gameState.owned[idx]) {
        gameState.wIdx = idx;
        gameState.reloadTimer = 0;
        UI.aiming = false;
        rebuildWeaponModel(WEAPONS[idx]);
        toast(WEAPONS[idx].name);
        return;
      }
    }
  }

  function doReload() {
    if (UI.screen !== 'play' || !gameState) return;
    const w = WEAPONS[gameState.wIdx];
    if (!w || w.melee || gameState.reloadTimer > 0) return;
    if (gameState.mag[gameState.wIdx] >= w.mag || gameState.ammo[gameState.wIdx] <= 0) return;
    gameState.reloadTimer = w.rel;
    gameState.reloadIdx = gameState.wIdx;
    beep(250, 0.12, 'square', 0.1, 0.7);
  }

  function doUseFood() {
    if (UI.screen !== 'play' || !gameState) return;
    if (gameState.mats.food > 0) {
      gameState.mats.food--;
      gameState.food = Math.min(100, gameState.food + 35);
      gameState.hp = Math.min(100, gameState.hp + 10);
      beep(520, 0.12, 'sine', 0.12, 1.4);
      toast('+35 Fome / +10 Vida');
    } else toast('Sem comida');
  }

  function doUseWater() {
    if (UI.screen !== 'play' || !gameState) return;
    if (gameState.mats.water > 0) {
      gameState.mats.water--;
      gameState.water = Math.min(100, gameState.water + 35);
      gameState.stamina = Math.min(100, gameState.stamina + 30);
      beep(620, 0.12, 'sine', 0.12, 1.4);
      toast('+35 Sede / +30 Stamina');
    } else toast('Sem água');
  }

  function doThrowItem(isBomb) {
    if (UI.screen !== 'play' || !gameState) return;
    if (isBomb) {
      if (gameState.mats.bb <= 0) { toast('Sem bombas caseiras'); return; }
      gameState.mats.bb--;
      const mesh = new T.Mesh(new T.SphereGeometry(0.26, 8, 8), new T.MeshStandardMaterial({ color: 0xb82925 }));
      mesh.position.set(gameState.x, gameState.y + 0.5, gameState.z);
      scene.add(mesh);
      bombs.push({ mesh, vx: 0, vy: 2, vz: 0, timer: 2.5, radius: 9, dmg: 26 });
      toast('Bomba armada!');
    } else {
      if (gameState.mats.gr <= 0) { toast('Sem granadas'); return; }
      gameState.mats.gr--;
      const dir = new T.Vector3();
      camera.getWorldDirection(dir);
      const mesh = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), new T.MeshStandardMaterial({ color: 0x4f6b2f }));
      mesh.position.set(gameState.x, gameState.y + 1.5, gameState.z);
      scene.add(mesh);
      bombs.push({ mesh, vx: dir.x * 15, vy: dir.y * 15 + 4, vz: dir.z * 15, timer: 1.8, radius: 7, dmg: 16 });
      toast('Granada lançada!');
    }
  }

  function explodeAt(x, y, z, radius, dmg) {
    beep(62, 0.35, 'sawtooth', 0.25, 0.35);
    const fx = new T.Mesh(new T.SphereGeometry(radius * 0.45, 10, 10), new T.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.8 }));
    fx.position.set(x, y, z);
    scene.add(fx);
    setTimeout(() => scene.remove(fx), 180);

    for (const zmb of zombies) {
      if (zmb.userData.dead) continue;
      const dist = Math.hypot(zmb.position.x - x, zmb.position.z - z);
      if (dist <= radius) {
        zmb.userData.hp -= dmg * (1 - dist / (radius * 1.15));
        if (zmb.userData.hp <= 0) killZombie(zmb, false);
      }
    }
    const pDist = Math.hypot(gameState.x - x, gameState.z - z);
    if (pDist < radius * 0.8) {
      damagePlayer(dmg * 0.45 * (1 - pDist / radius));
    }
  }

  function killZombie(zmb, isHeadshot) {
    if (zmb.userData.dead) return;
    zmb.userData.dead = true;
    zmb.userData.deadTimer = 0;
    gameState.kills++;
    gameState.score += zmb.userData.isBoss ? 120 : (isHeadshot ? 25 : 12);

  function fireWeapon() {
    if (!gameState || gameState.cd > 0 || gameState.reloadTimer > 0) return;
    const w = WEAPONS[gameState.wIdx];
    if (!w) return;
    ensureAudio();

    if (w.melee) {
      gameState.cd = w.delay;
      beep(w.freq, 0.1, w.ty, 0.14, 1.5);
      gunGroup.position.z = -0.35;
      gunGroup.rotation.x = -0.65;
      gunGroup.rotation.z = 0.45;
      const dir = new T.Vector3();
      camera.getWorldDirection(dir);
      for (const zmb of zombies) {
        if (zmb.userData.dead) continue;
        const dx = zmb.position.x - gameState.x;
        const dz = zmb.position.z - gameState.z;
        const dist = Math.hypot(dx, dz);
        if (dist <= w.rng) {
          const align = ((dx / Math.max(0.01, dist)) * dir.x + (dz / Math.max(0.01, dist)) * dir.z);
          if (align > 0.35) {
            zmb.userData.hp -= w.dmg;
            if (zmb.userData.hp <= 0) killZombie(zmb, false);
          }
        }
      }
      return;
    }

    if (gameState.mag[gameState.wIdx] <= 0) {
      doReload();
      return;
    }

    gameState.cd = w.delay;
    gameState.mag[gameState.wIdx]--;
    beep(w.freq, 0.1, w.ty, 0.15, 0.4);
    gunGroup.position.z = -0.42;
    gunGroup.rotation.x = 0.08;
    flashLight.intensity = 3.0;
    $('hitFlash').style.opacity = '0.22';

    const alive = zombies.filter(z => !z.userData.dead);
    if (!alive.length) return;

    const spread = w.sp * 10 * (UI.aiming ? 0.25 : 1);
    for (let i = 0; i < w.pel; i++) {
      raycaster.setFromCamera({ x: (rand() - 0.5) * spread, y: (rand() - 0.5) * spread }, camera);
      const hits = raycaster.intersectObjects(alive, true);
      if (!hits.length) continue;
      const hit = hits[0];
      let obj = hit.object;
      while (obj && !obj.userData.hp && obj.parent) obj = obj.parent;
      if (!obj || obj.userData.dead) continue;
      const hs = Boolean(hit.object.userData.isHead);
      obj.userData.hp -= w.dmg * (hs ? 2.1 : 1);
      if (obj.userData.hp <= 0) {
        killZombie(obj, hs);
      } else {
        gameState.score += 3;
      }
    }
  }

      if (Math.hypot(p.x - gameState.x, p.z - gameState.z) < 1.5) {

        else if (p.kind === 'd') { gameState.mats.water++; gameState.water = Math.min(100, gameState.water + 20); toast('+ Água'); }
        else if (p.kind === 'a') {
          const idx = gameState.owned[gameState.wIdx] && !WEAPONS[gameState.wIdx].melee ? gameState.wIdx : 0;
          gameState.ammo[idx] += WEAPONS[idx].pool;
          toast('+ Munição (' + WEAPONS[idx].name + ')');

  // Otimização: oculta caixas/paredes muito além da distância de render
  let cullCounter = 0;
  function cullDistantGeometry() {
    const maxDist = (UI.cfg.rd || 150) + 25;
    const maxDistSq = maxDist * maxDist;
    const cx = camera.position.x;
    const cz = camera.position.z;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      const dx = b.cx - cx;
      const dz = b.cz - cz;
      b.mesh.visible = (dx * dx + dz * dz) <= maxDistSq;
    }
  }

  function updateSimulation(dt) {
    if (!gameState) return;
    gameState.cd = Math.max(0, gameState.cd - dt);
    gameState.dashCd = Math.max(0, gameState.dashCd - dt);
    if (gameState.dashTimer > 0) gameState.dashTimer -= dt;
    else gameState.stamina = Math.min(100, gameState.stamina + 18 * dt);
    if (gameState.slideTimer > 0) gameState.slideTimer -= dt;

    if (gameState.reloadTimer > 0) {
      gameState.reloadTimer -= dt;
      if (gameState.reloadTimer <= 0) {
        const w = WEAPONS[gameState.reloadIdx];
        if (w && !w.melee && gameState.owned[gameState.reloadIdx]) {
          const need = Math.min(w.mag - gameState.mag[gameState.reloadIdx], gameState.ammo[gameState.reloadIdx]);
          if (need > 0) {
            gameState.mag[gameState.reloadIdx] += need;
            gameState.ammo[gameState.reloadIdx] -= need;
          }
        }
      }
    }

    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let iz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    if (touchStick.left) {
      ix = touchStick.left.dx;
      iz = touchStick.left.dy;
    }
    const mag = Math.hypot(ix, iz);
    if (mag > 1) { ix /= mag; iz /= mag; }
    if (gameState.slideTimer > 0 && mag < 0.1) iz = -1;
    if (gameState.dashTimer > 0 && mag < 0.1) iz = -1;

    const sprinting = keys.ShiftLeft || (touchStick.left && mag > 0.88);
    const speed = (sprinting ? 8.6 : 5.8) * (gameState.slideTimer > 0 ? 1.55 : 1) * (gameState.dashTimer > 0 ? 2.6 : 1);
    const cosY = Math.cos(gameState.yaw);
    const sinY = Math.sin(gameState.yaw);
    const moveX = (ix * cosY + iz * sinY) * speed * dt;
    const moveZ = (-ix * sinY + iz * cosY) * speed * dt;

    const hitX = isBlocked(gameState.x + moveX, gameState.z, gameState.y, 0.42);
    const hitZ = isBlocked(gameState.x, gameState.z + moveZ, gameState.y, 0.42);
    if (!hitX) gameState.x += moveX;
    if (!hitZ) gameState.z += moveZ;

    const stepTarget = hitX || hitZ;
    if (stepTarget && gameState.y <= stepTarget.top && stepTarget.top - gameState.y <= 1.38 && mag > 0.35) {
      gameState.y = stepTarget.top;
      gameState.vy = Math.max(gameState.vy, 1.5);
      gameState.airJumps = 1;
    }

    gameState.x = Math.max(-MAP_LIMIT + 2, Math.min(MAP_LIMIT - 2, gameState.x));
    gameState.z = Math.max(-MAP_LIMIT + 2, Math.min(MAP_LIMIT - 2, gameState.z));

    const floor = getFloorHeight(gameState.x, gameState.z, gameState.y);
    gameState.vy -= 23 * dt;
    gameState.y += gameState.vy * dt;

    if (gameState.y <= floor) {
      if (gameState.wasAir && floor > 0.6 && gameState.airStreak) {
        gameState.combo++;
        gameState.score += 12 * gameState.combo;
        beep(520, 0.14, 'sine', 0.12, 1.8);
      } else if (gameState.wasAir && floor <= 0.6) {
        gameState.combo = 0;
      }
      gameState.y = floor;
      gameState.vy = 0;
      gameState.wasAir = false;
      gameState.airJumps = 1;
      gameState.airStreak = false;
    } else {
      gameState.wasAir = true;
    }

    gameState.food = Math.max(0, gameState.food - 0.30 * dt);
    gameState.water = Math.max(0, gameState.water - 0.42 * dt);
    if (gameState.food <= 0 || gameState.water <= 0) {
      damagePlayer(2.0 * dt);
    } else if (gameState.food > 55 && gameState.water > 55) {
      gameState.hp = Math.min(100, gameState.hp + 1.1 * dt);
    }

    const wave = 1 + Math.floor(gameState.kills / 10);
    if (wave % 3 === 0 && gameState.lastBossWave !== wave) {
      gameState.lastBossWave = wave;
      spawnBoss();
    }

    gameState.hordeTimer -= dt;
    if (gameState.hordeTimer <= 0) {
      gameState.hordeTimer = 85;
      const hAng = rand() * Math.PI * 2;
      for (let i = 0; i < 10 + wave * 2; i++) spawnNearbyZombie(hAng);
      toast('⚠ HORDA SE APROXIMANDO!');
      beep(65, 0.9, 'sawtooth', 0.22, 0.6);
    }

    const targetZombies = Math.min(34, 10 + wave * 3);
    while (zombies.filter(z => !z.userData.dead).length < targetZombies && rand() < 0.25) {
      spawnNearbyZombie();
    }

    if (UI.firing) fireWeapon();
    collectPickups();

    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.timer -= dt;
      b.vy -= 20 * dt;
      b.mesh.position.x += b.vx * dt;
      b.mesh.position.y += b.vy * dt;
      b.mesh.position.z += b.vz * dt;
      const bFloor = getFloorHeight(b.mesh.position.x, b.mesh.position.z, b.mesh.position.y, 0.2) + 0.2;
      if (b.mesh.position.y < bFloor) {
        b.mesh.position.y = bFloor;
        b.vy *= -0.35;
        b.vx *= 0.7;
        b.vz *= 0.7;
      }
      if (b.timer <= 0) {
        explodeAt(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, b.radius, b.dmg);
        scene.remove(b.mesh);
        bombs.splice(i, 1);
      }
    }

    const nowSec = performance.now() * 0.001;
    for (let i = zombies.length - 1; i >= 0; i--) {
      const zmb = zombies[i];
      const d = zmb.userData;
      if (d.dead) {
        d.deadTimer += dt;
        zmb.rotation.x = Math.min(1.5, d.deadTimer * 3.5);
        if (d.deadTimer > 1.0) {
          scene.remove(zmb);
          zombies.splice(i, 1);
        }
        continue;
      }
      const dx = gameState.x - zmb.position.x;
      const dz = gameState.z - zmb.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 65 && !d.isBoss) {
        scene.remove(zmb);
        zombies.splice(i, 1);
        continue;
      }
      let moving = false;
      if (dist > 0.05 && dist < 34) {
        moving = true;
        const stepDist = d.speed * dt;
        const nx = zmb.position.x + (dx / dist) * stepDist;
        const nz = zmb.position.z + (dz / dist) * stepDist;
        if (!isBlocked(nx, zmb.position.z, 0, 0.45)) zmb.position.x = nx;
        if (!isBlocked(zmb.position.x, nz, 0, 0.45)) zmb.position.z = nz;
        zmb.rotation.y = Math.atan2(dx, dz);
      }

      // Animação articulada dos membros dos zumbis
      const L = d.limbs;
      if (L) {
        const swing = moving ? Math.sin(nowSec * d.speed * 2.6 + d.phase) : 0;
        L.legL.rotation.x = swing * 0.7;
        L.legR.rotation.x = -swing * 0.7;
        L.armL.rotation.x = 0.15 + swing * 0.25;
        L.armR.rotation.x = 0.15 - swing * 0.25;
        L.head.rotation.z = Math.sin(nowSec * 2 + d.phase) * 0.12;
      }

      const reach = d.isBoss ? 1.85 : 1.05;
      if (dist < reach && gameState.y < 1.3) {
        damagePlayer((d.isBoss ? 32 : 14) * dt);
      }
    }

    gameState.saveTimer += dt;
    if (gameState.saveTimer > 6) {
      gameState.saveTimer = 0;
      saveGame(false);
    }
  }

  let lastHudCache = '';
  function syncHud() {
    if (!gameState) return;
    const w = WEAPONS[gameState.wIdx] || WEAPONS[0];
    const r = RARITY[w.rarity] || RARITY.common;
    const wave = 1 + Math.floor(gameState.kills / 10);

    $('barHp').style.width = Math.max(0, gameState.hp) + '%';
    $('barFd').style.width = Math.max(0, gameState.food) + '%';
    $('barWt').style.width = Math.max(0, gameState.water) + '%';
    $('barSt').style.width = Math.max(0, gameState.stamina) + '%';

    $('qFoodN').textContent = gameState.mats.food || 0;
    $('qWaterN').textContent = gameState.mats.water || 0;
    $('qGrN').textContent = gameState.mats.gr || 0;
    $('qBbN').textContent = gameState.mats.bb || 0;

    const ammoTxt = w.melee ? 'Corpo a corpo' : (gameState.reloadTimer > 0 ? 'Recarregando...' : `${gameState.mag[gameState.wIdx]}/${gameState.ammo[gameState.wIdx]}`);
    const hudKey = `${w.name}|${ammoTxt}|${wave}|${gameState.score}|${gameState.combo}|${gameState.mats.m}|${gameState.mats.w}|${gameState.mats.c}|${gameState.mats.g}`;
    if (hudKey !== lastHudCache) {
      lastHudCache = hudKey;
      $('matsHud').textContent = `⚙️ ${gameState.mats.m} · 🪵 ${gameState.mats.w} · 🧵 ${gameState.mats.c} · 💥 ${gameState.mats.g}`;
      $('inf').innerHTML = `${w.name} <span style="color:${r.color}">[${r.label}]</span> (${ammoTxt}) · Onda ${wave} · Pts ${gameState.score}${gameState.combo > 1 ? ` · x${gameState.combo}` : ''}`;
    }

    const activeBoss = zombies.find(z => !z.userData.dead && z.userData.isBoss);
    $('bbar').style.display = (UI.screen === 'play' && activeBoss) ? 'block' : 'none';
    if (activeBoss) {
      $('bbi').style.width = Math.max(0, (activeBoss.userData.hp / activeBoss.userData.maxHp) * 100) + '%';
    }
  }

  let lastFrame = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    if (UI.cfg.fps && now - lastFrame < 1000 / UI.cfg.fps - 2) return;
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;

    if (UI.screen === 'play' && gameState) {
      updateSimulation(dt);
      const crouchOffset = gameState.slideTimer > 0 ? 0.85 : 0;
      camera.position.set(gameState.x, gameState.y + 1.7 - crouchOffset, gameState.z);
      camera.rotation.y = gameState.yaw;
      camera.rotation.x = gameState.pitch;

      if ((++cullCounter & 3) === 0) cullDistantGeometry();

      const curW = WEAPONS[gameState.wIdx] || WEAPONS[0];
      const scoped = Boolean(UI.aiming && curW.scope);
      const targetFov = UI.aiming ? (curW.scope ? (curW.zoom || 18) : 52) : (gameState.dashTimer > 0 ? 86 : 75);
      if (Math.abs(camera.fov - targetFov) > 0.1) {
        camera.fov += (targetFov - camera.fov) * 0.22;
        camera.updateProjectionMatrix();
      }
      $('scopeOverlay').style.display = scoped ? 'block' : 'none';
      $('crosshair').style.display = scoped ? 'none' : 'block';
      gunGroup.visible = !scoped;

      gunGroup.position.x += ((UI.aiming ? 0 : 0.26) - gunGroup.position.x) * 12 * dt;
      gunGroup.position.y += ((UI.aiming ? -0.18 : -0.24) - gunGroup.position.y) * 12 * dt;
      gunGroup.position.z += (-0.52 - gunGroup.position.z) * 10 * dt;
      gunGroup.rotation.x += (0 - gunGroup.rotation.x) * 12 * dt;
      gunGroup.rotation.z += (0 - gunGroup.rotation.z) * 12 * dt;

      flashLight.intensity = Math.max(0, flashLight.intensity - dt * 28);
      $('hitFlash').style.opacity = String(Math.max(0, parseFloat($('hitFlash').style.opacity || '0') - dt * 3.5));
      syncHud();
    } else if (UI.screen === 'menu') {
      const ang = now * 0.00025;
      camera.position.set(Math.cos(ang) * 32, 14, Math.sin(ang) * 32);
      camera.lookAt(0, 3, 0);
      gunGroup.visible = false;
    }

    renderer.render(scene, camera);
  }

  Bridge.startGame = (useSave = false) => {
    ensureAudio();
    if (matchMedia('(pointer: coarse)').matches) requestFullscreenSafe();
    resetWorld(useSave);
    UI.screen = 'play';
    UI.aiming = false;
    syncScreenVisibility();
    syncHud();
    toast(useSave ? 'Jogo carregado!' : 'Novo jogo iniciado!');
  };
  Bridge.jump = doJump;
  Bridge.dash = doDash;
  Bridge.swapWeapon = doSwapWeapon;
  Bridge.slide = doSlide;
  Bridge.throwItem = doThrowItem;
  Bridge.reload = doReload;
  Bridge.useFood = doUseFood;
  Bridge.useWater = doUseWater;

  window.addEventListener('resize', Bridge.applyGraphics);

  buildCity();
  resetWorld(false);
  Bridge.applyGraphics();

  const bestSaved = Number(loadData('zparkour3d_best') || 0);
  if (bestSaved > 0) $('bestTxt').textContent = 'RECORDE: ' + bestSaved;
  try {
    const prevRun = JSON.parse(loadData(SAVE_KEY) || 'null');
    if (prevRun && prevRun.hp > 0) $('btnContinue').style.display = 'block';
  } catch (_) {}

  UI.screen = 'menu';
  syncScreenVisibility();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
